<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

html,body{height:100%}
img{-webkit-user-drag:none;user-drag:none}

body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(2px 2px at 20% 30%,#fff6,transparent),radial-gradient(2px 2px at 70% 60%,#fff5,transparent),radial-gradient(1px 1px at 40% 80%,#fff7,transparent),radial-gradient(2px 2px at 85% 15%,#fff5,transparent),radial-gradient(1px 1px at 10% 70%,#fff6,transparent);animation:tw 4s infinite alternate}

main{flex:1;padding:12px 12px var(--padb,172px)}

.jobcard{background:linear-gradient(#3a1f86,#26125e);border:4px solid #6f45e0;border-radius:16px;padding:9px 10px;

body.park{--ink:#3b2a1a;--paper:#fffdf6;--gold:#b97a00;--pink:#d63d86;--cyan:#0a7fa8;--green:#1f9a4c;--red:#d92f4c;

body.park .jbtag{background:#fff4dc;border-color:var(--ink);color:#2a1d12}
/* 座位表 */

body.park .seat{background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 #3b2a1a38}
body.park .seat:active{box-shadow:0 1px 0 #3b2a1a38}
body.park .seat.empty{background:#fffdf680;border:3px dashed #bba88c;box-shadow:none}
body.park .seat.empty .splus{color:#bba88c}
body.park .seat.new{border-color:#e0a000;box-shadow:0 0 0 3px #ffc81f55,0 4px 0 #3b2a1a38}

/* ================= 寵物扭蛋機／圖鑑（gacha）：卡片同時用 .it + .r1–.r5 攞稀有度框色 ================= */
.gc-wrap{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:center}
.gc-mach{position:relative;width:190px;flex:none}
.gc-mach svg{display:block;width:190px;height:auto;overflow:visible}
.gc-mach .gc-eggs{transform-box:fill-box;transform-origin:center}
.gc-mach.go .gc-eggs{animation:gcJig .14s linear 6}
.gc-mach .gc-knob{transform-box:fill-box;transform-origin:center;transition:transform .7s cubic-bezier(.5,1.6,.5,1)}
.gc-mach.go .gc-knob{transform:rotate(300deg)}
.gc-side{flex:1 1 230px;min-width:0;max-width:360px}
.gc-side select{width:100%;font-size:16px;padding:7px;border-radius:12px;border:3px solid #6f45e0;background:#1d0f4a;color:#fff}
.gc-info{margin-top:8px;font-size:14px;line-height:1.55}
.gc-pity{height:12px;background:#1a0d40;border-radius:6px;border:2px solid #0e0628;overflow:hidden;margin:4px 0}
.gc-pity i{display:block;height:100%;background:linear-gradient(90deg,#ffd23d,#ff5ea8);transition:.35s}
.gc-odds{font-size:11px;color:var(--dim);margin-top:6px;line-height:1.5}
.gc-stage{min-height:40px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.gc-slot{width:92px;height:118px;display:flex;align-items:center;justify-content:center;position:relative}
.gc-egg{width:52px;height:66px;border-radius:50% 50% 46% 46%/60% 60% 40% 40%;border:3px solid #fff8;position:relative;
 box-shadow:inset -8px -8px 0 #0003,inset 6px 6px 0 #fff5;animation:gcDrop .5s cubic-bezier(.3,1.5,.6,1) both,gcWob .18s ease-in-out .5s 5}
.gc-egg::after{content:'';position:absolute;left:0;right:0;top:44%;height:8px;background:repeating-linear-gradient(90deg,#fff9 0 6px,transparent 6px 12px)}
.gc-egg.pop{animation:gcBurst .28s ease-out forwards}
.gc-card{width:92px;padding:5px 3px;position:relative;cursor:default;animation:gcPop .42s cubic-bezier(.3,1.6,.5,1) both}
.gc-card b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc-card .gc-st,.gc-dc .gc-st{color:var(--gold);letter-spacing:-1px;font-size:12px}
.gc-card .gc-tag{position:absolute;top:-9px;right:-6px;background:var(--pink);color:#fff;font-size:10px;font-weight:900;border-radius:8px;padding:1px 5px}
.gc-card .gc-tag.pt{left:-6px;right:auto;background:var(--gold);color:#3a1500}
.gc-s4{border-color:#ffd23d!important;box-shadow:0 0 16px #ffd23dcc,inset 0 0 14px #ffd23d55}
.gc-s5{border-color:#fff!important;animation:gcPop .42s cubic-bezier(.3,1.6,.5,1) both,gcRain 1.2s linear .42s infinite}
.gc-flash{position:absolute;inset:-10px;border-radius:50%;pointer-events:none;animation:gcFlash .6s ease-out forwards}
.gc-dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin-top:10px}
.gc-dc{padding:6px 4px;position:relative}
.gc-dc.sel{outline:3px solid var(--cyan);outline-offset:1px}
.gc-dc.lock .gc-pic{filter:brightness(0) opacity(.35)}
.gc-dc .gc-q{position:absolute;left:0;right:0;top:22px;font-size:34px;font-weight:900;color:#fff9;pointer-events:none}
.gc-avs{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin-top:3px;min-height:20px}
.gc-av{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 3px;border-radius:10px;font-size:10px;font-weight:900;color:#fff;border:2px solid #0006}
.gc-box{margin-top:10px;padding:10px;border-radius:14px;background:#0e0628aa;border:2px solid #5b34c9;text-align:center;font-size:14px}
.gc-my .it{position:relative}
.gc-my .it .gc-n{position:absolute;top:2px;right:6px;font-weight:900;color:var(--gold);font-size:13px}
.gc-my .it .gc-on{color:var(--green);font-weight:900;font-size:11px}
@keyframes gcJig{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-3px,1px) rotate(-3deg)}75%{transform:translate(3px,-1px) rotate(3deg)}}
@keyframes gcDrop{from{transform:translateY(-120px) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes gcWob{0%,100%{transform:rotate(0)}30%{transform:rotate(-14deg)}70%{transform:rotate(14deg)}}
@keyframes gcBurst{to{transform:scale(1.7);opacity:0}}
@keyframes gcPop{from{transform:scale(.2) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
@keyframes gcRain{0%{box-shadow:0 0 18px #ff5ea8}25%{box-shadow:0 0 18px #ffd23d}50%{box-shadow:0 0 18px #5ee66b}75%{box-shadow:0 0 18px #48e5ff}100%{box-shadow:0 0 18px #ff5ea8}}
@keyframes gcFlash{from{opacity:1;transform:scale(.4)}to{opacity:0;transform:scale(1.6)}}
@media (prefers-reduced-motion:reduce){.gc-egg,.gc-card,.gc-s5,.gc-mach.go .gc-eggs{animation:none}}

body.minimode footer .hintbar{display:none}

body.minimode #dock .rchip{display:inline-block}
body.minimode #dockTog{display:none!important}
body.minimode.hasdt footer{padding-right:6px}
/* 大廳：tile 縮細，標籤照顯示 */

body.minimode .htitle{font-size:22px}
body.minimode .hsub span{font-size:13px;padding:2px 9px;border-width:2px}
body.minimode .hgrp{padding:20px 8px 10px;margin:0 0 22px;border-radius:18px;border-width:3px}
body.minimode .hlab{top:-15px;left:12px;font-size:14px;padding:1px 12px}
body.minimode .htiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px 6px}
body.minimode .htile,body.minimode.big .htile{width:auto;min-width:0}
body.minimode .hart{width:min(64px,100%)}
body.minimode .hpill,body.minimode.big .hpill{margin-top:-4px;font-size:14px;padding:2px 9px;border-width:2px}
body.minimode .hlock{width:26px;height:26px;font-size:13px;top:0;right:8px;border-width:2px}
/* 轉盤：個盤唔可以高過個窗，粒掣擺隔籬 */
body.minimode #v-wheel.on{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 14px}
body.minimode #v-wheel .row{margin-top:0}
body.minimode #v-wheel #wLeft{flex:0 0 100%}
body.minimode canvas#wheel{width:auto;height:auto;max-width:94vw;max-height:calc(100vh - var(--padt,50px) - 64px);min-height:160px}
body.minimode .ptr{font-size:24px;top:-6px}
body.minimode .big2{font-size:18px;padding:9px 16px}
/* 彈窗：唔准出界 */
body.minimode #modal{padding:6px}
body.minimode .box,body.minimode .box.wide{max-width:96vw;max-height:92vh;overflow:auto;padding:12px;border-width:4px;border-radius:16px}
body.minimode .box>.row.mact{margin:8px -12px -12px;padding:8px 12px 10px}
body.minimode .box h2{font-size:18px;margin-bottom:6px}
/* ================= 🎲 大富翁棋盤抽人＋🧱 磚頭合成屋（mono）：深紫做底，body.park 淺色覆蓋 ================= */
#v-mono{position:relative}
.mo-board{position:relative;margin:0 auto;border-radius:18px;background:#1a0d40;border:4px solid #6f45e0;box-shadow:0 6px 0 #0d0628;overflow:hidden;user-select:none;-webkit-user-select:none}
.mo-cell{position:absolute;box-sizing:border-box;border:2px solid #0e0628;background:linear-gradient(#3a1f86,#26125e);color:#fff;
 display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;transition:filter .3s,opacity .3s}
.mo-s::before{content:'';position:absolute;background:hsl(var(--hue),78%,60%)}
.mo-s.sd-t::before{left:0;right:0;bottom:0;height:calc(var(--cs)*.1)}
.mo-s.sd-b::before{left:0;right:0;top:0;height:calc(var(--cs)*.1)}
.mo-s.sd-l::before{top:0;bottom:0;right:0;width:calc(var(--cs)*.1)}
.mo-s.sd-r::before{top:0;bottom:0;left:0;width:calc(var(--cs)*.1)}
.mo-av{height:calc(var(--cs)*.52);display:flex;align-items:flex-end;justify-content:center;pointer-events:none;overflow:visible}
.mo-dot{width:calc(var(--cs)*.44);height:calc(var(--cs)*.44);border-radius:50%;border:2px solid #0007;display:flex;align-items:center;justify-content:center;
 font-weight:900;color:#fff;font-size:calc(var(--cs)*.22);text-shadow:0 1px 0 #0006;margin-bottom:2px}
.mo-nm{font-weight:900;font-size:clamp(10px,calc(var(--cs)*.17),20px);max-width:94%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;position:relative;z-index:1}
.mo-hs{position:absolute;right:2px;top:2px;width:calc(var(--cs)*.34);height:calc(var(--cs)*.34);pointer-events:none;z-index:2}
.mo-s.sd-b .mo-hs{top:calc(var(--cs)*.1 + 2px)}
.mo-s.sd-l .mo-hs{right:calc(var(--cs)*.1 + 2px)}
.mo-hs svg,.mo-cardh svg{display:block;width:100%;height:100%;overflow:visible}
.mo-ck{position:absolute;left:3px;top:1px;font-size:12px;color:var(--green);font-weight:900;z-index:2}
.mo-cell.done{filter:grayscale(1);opacity:.4}
.mo-c{font-weight:900;text-align:center;line-height:1.1;cursor:default}
.mo-c b{font-size:calc(var(--cs)*.36);line-height:1}
.mo-c span{font-size:clamp(12px,calc(var(--cs)*.2),26px)}
.mo-chance{background:linear-gradient(135deg,#fff08a,#ffc02e)!important;color:#3a1500!important}
.mo-fate{background:linear-gradient(135deg,#ffd0ee,#ff7ac0)!important;color:#4a0b2e!important}
.mo-rest{background:repeating-linear-gradient(45deg,#2a1668,#2a1668 8px,#241260 8px,#241260 16px)!important;color:#c8b8f5;cursor:default;font-size:clamp(11px,calc(var(--cs)*.2),20px)}
.mo-rest span{font-size:clamp(10px,calc(var(--cs)*.15),16px);font-weight:900}
.mo-cell.hit{z-index:6;filter:none;opacity:1;animation:moHit .7s cubic-bezier(.3,1.6,.5,1) both;box-shadow:0 0 0 4px #ffd23d,0 0 34px 12px #ffd23dcc}
.mo-spot{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;z-index:5}
.mo-spot.on{opacity:1}
.mo-mid{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px;box-sizing:border-box;text-align:center;overflow:auto}
.mo-title{font-size:clamp(16px,2.4vw,26px);font-weight:900;color:var(--gold);letter-spacing:1px}
.mo-dice{display:flex;gap:14px;align-items:center;justify-content:center}
.mo-die{width:62px;height:62px;background:#fff;border:3px solid #3b2a1a;border-radius:14px;box-shadow:0 5px 0 #3b2a1a66,inset -5px -5px 0 #0000000f;
 display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:8px;box-sizing:border-box}
.mo-die i{width:11px;height:11px;border-radius:50%;background:#3b2a1a;align-self:center;justify-self:center;visibility:hidden}
.mo-die i.on{visibility:visible}
.mo-die.one i.on{background:#e0414f;width:15px;height:15px}
.mo-die.roll{animation:moRoll .18s linear infinite}
.mo-sum{font-size:28px;font-weight:900;min-width:48px;color:var(--gold)}
.mo-go{font-size:22px!important;padding:12px 28px!important}
.mo-go:disabled,.mo-row .nb:disabled,.mo-fz:disabled,#mhBuild:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.6)}
.mo-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.mo-row .nb{font-size:14px;padding:6px 10px}
.mo-info{font-size:14px;font-weight:900}
.mo-log{font-size:12px;color:var(--dim);max-width:100%}
.mo-pawn{position:absolute;z-index:7;pointer-events:none;transition:left .13s ease-out,top .13s ease-out;filter:drop-shadow(0 4px 2px #0006)}
.mo-pawn.fly{transition:left .55s cubic-bezier(.5,-.3,.4,1.3),top .55s cubic-bezier(.5,-.3,.4,1.3)}
.mo-pawn svg{display:block;width:100%;height:100%;overflow:visible}
.mo-pawn.hop svg{animation:moHop .15s ease-out}
.mo-drop{position:fixed;z-index:95;width:60px;pointer-events:none;animation:moFall .75s cubic-bezier(.55,0,.75,1.25) both}
.mo-drop svg{display:block;width:60px;height:46px;overflow:visible}
.mo-drop.g{filter:drop-shadow(0 0 10px #ffd23d) drop-shadow(0 0 24px #ffae00)}
.mo-drop.out{animation:moFade .5s ease-in forwards}
.mo-drop .mo-tag{position:absolute;top:100%;left:50%;transform:translateX(-50%);white-space:nowrap;background:#3b2a1a;color:#fff;font-weight:900;font-size:13px;padding:2px 8px;border-radius:10px;border:2px solid #fff}
.mo-pk{display:flex;gap:14px;align-items:flex-end;justify-content:center}
.mo-pkh{font-weight:900;font-size:14px}
.mo-pkh svg{width:96px;height:96px}
.mo-bkr{display:inline-flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:6px 0;font-weight:900;font-size:14px}
.mo-bkr span{display:inline-flex;align-items:center;gap:1px}
.mo-bkr svg{width:26px;height:20px}
.mo-x2{color:var(--pink);font-weight:900;font-size:18px}
.mo-hstage{height:176px;display:flex;align-items:flex-end;justify-content:center;position:relative;overflow:hidden;border-radius:16px;
 background:linear-gradient(#2c1b70 0,#3a2490 70%,#2f7a4f 70%,#256b42 100%);margin:4px 0 8px}
.mo-hstage svg{width:164px;height:164px;overflow:visible}
.mo-rise svg{animation:moRise 1.1s cubic-bezier(.3,1.4,.5,1) both}
.mo-shake svg{animation:moShake .12s linear 7}
.mo-smoke{position:absolute;width:44px;height:44px;border-radius:50%;background:#a7adb3;opacity:.85;pointer-events:none;animation:moSmoke 1.3s ease-out forwards}
.mo-bks{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mo-bk{text-align:center;padding:6px 3px;border-radius:12px;border:2px solid #5b34c9;background:#0e0628aa;font-size:12px}
.mo-bk svg{width:48px;height:37px;display:block;margin:0 auto;overflow:visible}
.mo-bkn{font-size:20px;font-weight:900}
.mo-bk .nb{font-size:13px;padding:4px 8px;margin-top:3px}
.mo-bk.pop{animation:moPop .6s cubic-bezier(.3,1.6,.5,1)}
.mo-use{display:flex;gap:4px;justify-content:center;align-items:center;min-height:38px;flex-wrap:wrap;font-weight:900}
.mo-use svg{width:34px;height:26px}
.mo-drow{display:block;margin:10px auto 0;max-width:100%;white-space:normal;font-size:15px}
.mo-cardh{position:absolute;right:3px;top:32px;width:26px;height:26px;z-index:2;pointer-events:none}
.mo-street{display:flex;gap:12px;overflow-x:auto;align-items:flex-end;padding:14px 10px 0;border-radius:16px;
 background:linear-gradient(#2c1b70,#46309c calc(100% - 58px),#555 calc(100% - 58px),#555 calc(100% - 50px),#2f7a4f calc(100% - 50px))}
.mo-lot{flex:none;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:pointer;min-width:84px;padding-bottom:6px}
.mo-lot svg{display:block;overflow:visible}
.mo-ln{font-weight:900;font-size:15px;color:#fff;text-shadow:0 1px 2px #000;max-width:130px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mo-ll{font-size:12px;font-weight:900;color:#ffe680}
.mo-ev{border-radius:18px;padding:16px;text-align:center;animation:moFlip .55s cubic-bezier(.3,1.4,.5,1) both}
.mo-ev.chance{background:linear-gradient(135deg,#fff08a,#ffc02e);color:#3a1500}
.mo-ev.fate{background:linear-gradient(135deg,#ffd0ee,#ff7ac0);color:#4a0b2e}
.mo-evh{font-size:26px;font-weight:900}
.mo-evi{font-size:72px;line-height:1.2}
.mo-evt{font-size:22px;font-weight:900;line-height:1.4}
.mo-empty{text-align:center;padding:60px 10px;font-size:18px;color:var(--dim)}
body.park .mo-board{background:#cfeec0;border-color:var(--ink);box-shadow:0 6px 0 #3b2a1a38}
body.park .mo-cell{background:#fffdf6;border-color:var(--ink);color:#2a1d12}
body.park .mo-rest{background:repeating-linear-gradient(45deg,#f1ead8,#f1ead8 8px,#e8dfc8 8px,#e8dfc8 16px)!important;color:#8a7a66}
body.park .mo-title{color:#b95a00}
body.park .mo-sum{color:#b95a00}
body.park .mo-bk{background:#fff;border-color:var(--ink)}
body.park .mo-hstage{background:linear-gradient(#bfe9ff 0,#e6f7ff 70%,#7ed957 70%,#5cbf3a 100%);border:3px solid var(--ink)}
body.park .mo-street{background:linear-gradient(#bfe9ff,#eaf8ff calc(100% - 58px),#8d8d8d calc(100% - 58px),#8d8d8d calc(100% - 50px),#7ed957 calc(100% - 50px));border:3px solid var(--ink)}
body.park .mo-ln{color:#2a1d12;text-shadow:0 1px 0 #fff}
body.park .mo-ll{color:#8a4a00}
body.park .mo-ev{border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink)}
@keyframes moHit{0%{transform:scale(1)}40%{transform:scale(1.4)}70%{transform:scale(1.12)}100%{transform:scale(1.22)}}
@keyframes moRoll{0%{transform:rotate(0) translateY(0)}50%{transform:rotate(180deg) translateY(-9px)}100%{transform:rotate(360deg) translateY(0)}}
@keyframes moHop{0%{transform:translateY(0)}50%{transform:translateY(-45%) scale(1.08)}100%{transform:none}}
@keyframes moFall{from{transform:translate(-50%,var(--fy)) rotate(-40deg)}to{transform:translate(-50%,-50%) rotate(0)}}
@keyframes moFade{from{transform:translate(-50%,-50%)}to{transform:translate(-50%,-150%) scale(.6);opacity:0}}
@keyframes moRise{from{transform:translateY(80%) scaleY(.3);opacity:0}to{transform:none;opacity:1}}
@keyframes moShake{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-6px) rotate(-3deg)}75%{transform:translateX(6px) rotate(3deg)}}
@keyframes moSmoke{from{transform:translate(-50%,0) scale(.5)}to{transform:translate(-50%,-90px) scale(2.3);opacity:0}}
@keyframes moPop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes moFlip{from{transform:perspective(600px) rotateY(90deg) scale(.7);opacity:0}to{transform:none;opacity:1}}
@media (max-width:600px){.mo-die{width:46px;height:46px;padding:5px;border-radius:11px}.mo-die i{width:8px;height:8px}.mo-die.one i.on{width:11px;height:11px}
 .mo-go{font-size:18px!important;padding:9px 16px!important}.mo-row .nb{font-size:12px;padding:5px 7px}.mo-bks{grid-template-columns:repeat(3,1fr)}.mo-sum{font-size:22px;min-width:34px}}
@media (prefers-reduced-motion:reduce){.mo-cell.hit,.mo-die.roll,.mo-pawn.hop svg,.mo-drop,.mo-rise svg,.mo-shake svg,.mo-ev,.mo-bk.pop{animation:none}}
/* ================= 📜 懸賞任務板（quest）：深紫做底，body.park 淺色覆蓋，body.minimode 收細 ================= */
#v-quest{position:relative}
.qv-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:2px 0 12px}
.qv-t{font-size:26px;color:var(--gold);margin:0;white-space:nowrap}
.qv-sub{display:flex;flex-wrap:wrap;gap:4px}
.qv-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex:1 1 100%}
.qv-tp{font-size:14px;padding:6px 10px}
.qv-tp b{color:var(--gold)}
.qv-empty{text-align:center;color:var(--dim);font-size:17px;padding:40px 12px;border:3px dashed var(--line);border-radius:18px}
.qv-wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;align-items:start}
.qv-card{position:relative;min-width:0;background:linear-gradient(#3a1f86,#26125e);border:4px solid #6f45e0;border-radius:18px;padding:12px 12px 10px;
 box-shadow:0 6px 0 #180b40;display:flex;flex-direction:column;gap:7px;overflow:hidden}
.qv-card.pin{border-color:var(--gold);box-shadow:0 6px 0 #180b40,0 0 0 3px #ffd23d44}
.qv-card.ex{filter:grayscale(1);opacity:.62}
.qv-card.full:not(.ex){opacity:.85}
.qv-pinb{position:absolute;right:8px;top:6px;font-size:18px;line-height:1}
.qv-ttl{font-size:19px;font-weight:900;color:var(--gold);line-height:1.25;padding-right:22px;overflow-wrap:anywhere}
.qv-desc{font-size:14px;line-height:1.45;color:#e6dcff;overflow-wrap:anywhere;white-space:pre-wrap;max-height:6.2em;overflow:auto}
.qv-meta{display:flex;flex-wrap:wrap;gap:5px;font-size:14px}
.qv-meta>span{display:inline-flex;align-items:center;gap:4px;background:#0e0628;border:2px solid var(--line);border-radius:10px;padding:3px 8px;max-width:100%;min-width:0}
.qv-rw{font-weight:900;font-size:16px;color:var(--gold)}
.qv-bk svg{width:22px;height:22px;flex:0 0 auto}
.qv-due.today{border-color:var(--pink)!important;color:var(--pink);font-weight:900}
.qv-due.ex{color:var(--red);font-weight:900}
.qv-who{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:block!important}
.qv-pb{height:8px;border-radius:6px;background:#0e0628;overflow:hidden;border:2px solid var(--line)}
.qv-pb i{display:block;height:100%;background:linear-gradient(90deg,#2fd36a,#ffd23d)}
.qv-btns{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.qv-btns .qv-done{flex:1 1 auto;font-size:15px;padding:8px 10px}
.qv-btns .nb{padding:6px 9px;font-size:15px}
.qv-done:disabled,.qv-dok:disabled,#qvPOk:disabled{filter:grayscale(1);opacity:.55;cursor:default}
.qv-stamp{position:absolute;right:10px;top:40px;transform:rotate(-12deg);border:3px solid #ff4d6d;color:#ff4d6d;border-radius:8px;padding:2px 8px;font-size:18px;font-weight:900;
 letter-spacing:2px;background:#ffffffcc;pointer-events:none}
/* 出任務表單 */
.qv-l{display:block;font-size:14px;font-weight:800;margin:8px 0 3px;color:var(--dim)}
.qv-l input,.qv-l select,.qv-l textarea{margin-top:3px;color-scheme:dark}
.qv-g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 10px}
.qv-tpr{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-bottom:4px}
.qv-to{display:flex;flex-wrap:wrap;gap:5px;max-height:26vh;overflow:auto;padding:4px 2px}
.qv-tb,.qv-all{background:#150a38;border:2px solid #6f45e0;border-radius:10px;padding:5px 9px;font-size:14px;color:#fff}

.qv-dr{font-weight:900;color:var(--gold);white-space:nowrap}
.qv-dd{font-size:13px;color:var(--dim);white-space:nowrap}
.qv-dok{font-size:14px;padding:5px 10px}

.qv-cq{position:absolute;left:5px;top:36px;font-size:16px;line-height:1;z-index:2;pointer-events:none;filter:drop-shadow(0 1px 0 #0008)}
/* 淺色（park） */

body.park .qv-card.pin{border-color:#e0a000;box-shadow:0 5px 0 #3b2a1a38,0 0 0 3px #ffd23d88}
body.park .qv-ttl{color:#7a4a00}
body.park .qv-desc{color:#4a3a2a}

body.park .qv-t{color:#7a4a00}
body.park .qv-tp b{color:#9a6400}
body.park .qv-l input,body.park .qv-l select,body.park .qv-l textarea{color-scheme:light}
body.park .qv-tb,body.park .qv-all{background:#fff;color:#2a1d12;border-color:var(--ink)}
body.park .qv-tb.on,body.park .qv-all.on{background:#ffcf3d;color:#2a1d12;border-color:var(--ink)}
body.park .qv-dsec{background:#fff8e6;border-color:#3b2a1a55}

#bdPop{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;pointer-events:none;background:radial-gradient(circle at 50% 46%,#0008,#0000 70%);transition:opacity .35s}

.bdp-card{position:relative;width:210px;padding:18px 12px 14px;border-radius:22px;text-align:center;background:linear-gradient(#341a7d,#1e0f4d);border:5px solid var(--bc);color:#fff;
 box-shadow:0 10px 0 #0d0628,0 0 40px var(--bc);animation:bdIn .7s cubic-bezier(.2,1.6,.4,1) both}
body.park .bdp-card{background:#fffdf6;color:#2a1d12;box-shadow:0 9px 0 #3b2a1a,0 0 40px var(--bc)}
.bdp-med{position:relative;width:112px;height:112px;margin:0 auto 8px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:62px;line-height:1;
 background:radial-gradient(circle at 35% 30%,#fff 0%,var(--bc) 55%,#0000 100%),var(--bc);border:5px solid #fff;box-shadow:0 0 0 5px var(--bc),0 0 30px var(--bc)}
.bdp-med span{position:relative;z-index:2;filter:drop-shadow(0 3px 0 #0005)}
.bdp-halo{position:absolute;left:50%;top:74px;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;border:5px solid var(--bc);animation:bdHalo 1.1s ease-out .25s 3 both;pointer-events:none}
.bdp-rays{position:absolute;left:50%;top:74px;width:230px;height:230px;margin:-115px 0 0 -115px;border-radius:50%;pointer-events:none;opacity:.55;
 background:repeating-conic-gradient(var(--bc) 0 8deg,#0000 8deg 24deg);-webkit-mask:radial-gradient(circle,#000 20%,#0000 68%);mask:radial-gradient(circle,#000 20%,#0000 68%);animation:bdSpin 6s linear infinite}

@keyframes bdIn{0%{transform:scale(.15) rotate(-20deg);opacity:0}60%{transform:scale(1.14) rotate(4deg);opacity:1}100%{transform:none;opacity:1}}
@keyframes bdHalo{0%{transform:scale(.8);opacity:1}100%{transform:scale(2.3);opacity:0}}

/* 班級卡右上角：最新徽章 */

/* ===== 📱 窄屏模式（body.narrow）=====
   學校電腦 Chrome 縮到 ~400×700 放螢幕一邊：頂列收做一行（☰ 選單），派分列收做右下角浮動掣＋bottom sheet，
   座位卡放大（自動排 3 張一行）。自動：闊 <640；⚙️ 設定可鎖定開／關（DB.narrow）。同 minimode 並存時 narrow 控制 nav／底列／grid。 */
#nwMenu,#nwCur,#nwBar,#nwNav,#nwScrim{display:none}
body.narrow header{flex-wrap:nowrap!important;gap:5px!important;padding:3px 5px!important;height:40px;box-sizing:border-box;overflow:hidden;align-items:center}
body.narrow header:has(#warn.on){height:auto;flex-wrap:wrap!important}
body.narrow header nav,body.narrow header #sync,body.narrow header #roomBtn{display:none!important}
body.narrow header #roomSel{display:inline-block!important;flex:0 1 auto;max-width:92px;min-width:52px;height:32px;padding:2px 4px!important;font-size:13px!important;box-sizing:border-box}
body.narrow header .dbl{flex:0 0 auto;height:32px;box-sizing:border-box;padding:2px 6px!important;font-size:13px!important;border-radius:11px;white-space:nowrap}
body.narrow #nwMenu{display:flex;align-items:center;justify-content:center;flex:0 0 36px;width:36px;height:32px;box-sizing:border-box;padding:0;
 font:inherit;font-size:20px;font-weight:900;line-height:1;border-radius:11px;cursor:pointer;background:#0e0628;color:#fff;border:3px solid var(--line);box-shadow:0 3px 0 #0c0628}
body.narrow #nwCur{display:flex;align-items:center;gap:4px;flex:1 1 auto;min-width:0;height:32px;padding:0 4px;font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;cursor:pointer;color:#fff}
#nwCur .nwct{overflow:hidden;text-overflow:ellipsis;min-width:0}
#nwCur img{height:24px;width:auto;max-width:32px;object-fit:contain;flex:0 0 auto}
#nwCur .nwdn{flex:0 0 auto;font-size:12px;opacity:.7}
body.park #nwMenu{background:#fff;color:#2a1d12;border-color:var(--ink);box-shadow:0 3px 0 var(--ink)}
body.park #nwCur{color:#2a1d12}
/* ☰ 選單 overlay */
#nwNav.on{display:flex;position:fixed;inset:0;z-index:72;background:#050210aa;align-items:flex-start;justify-content:center;padding:50px 10px 10px;box-sizing:border-box}
body.park #nwNav.on{background:#3b2a1a66}
#nwNav .nwcard{width:100%;max-width:520px;max-height:calc(100vh - 64px);overflow:auto;box-sizing:border-box;padding:12px;border-radius:20px;
 background:#1d0f4a;border:3px solid var(--line);box-shadow:0 6px 0 #0c0628;color:#fff;animation:nwDn .16s ease-out}
body.park #nwNav .nwcard{background:#fff;border-color:var(--ink);box-shadow:0 6px 0 var(--ink);color:#2a1d12}
#nwNav .nwhd{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px;font-size:17px;font-weight:900}
#nwNav .nwx{padding:4px 12px;font-size:16px}
#nwNav .nwg{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px}
#nwNav .nwt{min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 4px;box-sizing:border-box;
 border-radius:14px;font:inherit;font-size:14px;font-weight:900;line-height:1.15;cursor:pointer;background:#2a1660;color:#fff;border:3px solid var(--line);box-shadow:0 4px 0 #0c0628}
body.park #nwNav .nwt{background:#fffdf6;color:#2a1d12;border-color:var(--ink);box-shadow:0 4px 0 var(--ink)}
#nwNav .nwt.on,body.park #nwNav .nwt.on{background:#ffcf3d;color:#2a1d12}
#nwNav .nwt:active{transform:translateY(3px);box-shadow:none}
#nwNav .nwi{font-size:28px;line-height:1;height:34px;display:flex;align-items:center;justify-content:center}
#nwNav .nwi img{height:34px;width:auto;max-width:48px;object-fit:contain}
@keyframes nwDn{from{transform:translateY(-12px);opacity:0}to{transform:none;opacity:1}}
/* 頂列派分掣＋撤銷（BUILD 70：取代右下浮動掣，唔再遮住最後一行卡）。有派分列嘅 view 先出，冇就顯示 view 名 */
#nwPick,#nwUndo{display:none}
body.narrow.nwhasdock #nwCur{display:none}
body.narrow.nwhasdock #nwPick{display:flex;align-items:center;justify-content:center;gap:3px;flex:1 1 auto;min-width:0;height:32px;padding:0 8px;box-sizing:border-box;border-radius:11px;
 background:#ffcf3d;color:#2a1d12;border:3px solid var(--ink,#1d0d4d);box-shadow:0 3px 0 var(--ink,#1d0d4d);font:inherit;font-size:15px;font-weight:900;line-height:1;white-space:nowrap;overflow:hidden;cursor:pointer}
body.narrow.nwhasdock #nwUndo{display:flex;align-items:center;justify-content:center;flex:0 0 34px;width:34px;height:32px;padding:0;box-sizing:border-box;border-radius:11px;
 background:#fff;color:#2a1d12;border:3px solid var(--ink,#1d0d4d);box-shadow:0 3px 0 var(--ink,#1d0d4d);font:inherit;font-size:18px;font-weight:900;line-height:1;cursor:pointer}
#nwPick .nwpt{overflow:hidden;text-overflow:ellipsis;min-width:0}
#nwPick .nwdn{flex:0 0 auto;font-size:11px;opacity:.7}
#nwPick.neg{background:#ff9a9a}
#nwPick:active,#nwUndo:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink,#1d0d4d)}
/* 派分 bottom sheet（就係原本 #dock，換個樣） */
body.narrow #dock,body.narrow #dockTog{display:none!important}
body.narrow.nwsheet #nwScrim{display:block;position:fixed;inset:0;z-index:40;background:#05021088}
body.park.narrow.nwsheet #nwScrim{background:#3b2a1a55}
body.narrow.nwsheet #dock{display:grid!important;grid-template-columns:1fr 1fr;gap:8px;position:fixed;left:0;right:0;top:auto;bottom:0;z-index:45;max-height:72vh;overflow-y:auto;overflow-x:hidden;
 padding:12px 12px calc(14px + env(safe-area-inset-bottom))!important;box-sizing:border-box;border-radius:22px 22px 0 0;background:#1d0f4a;border:3px solid var(--line);border-bottom:0;
 box-shadow:0 -6px 0 #0c062855;animation:nwUp .18s ease-out;justify-content:stretch}
body.park.narrow.nwsheet #dock{background:#fff;border-color:var(--ink);box-shadow:0 -5px 0 #3b2a1a38}
body.narrow.nwsheet #dock::before{content:'⚡ 揀派分掣（揀完撳學生）';order:-3;grid-column:1/-1;font-weight:900;font-size:15px;text-align:center}
body.narrow.nwsheet #dock>*{grid-column:auto;width:100%;min-height:48px;margin:0;font-size:15px!important;padding:8px 6px!important;white-space:normal;line-height:1.2;
 box-sizing:border-box;display:flex;align-items:center;justify-content:center;text-align:center;transform:none}
body.narrow.nwsheet #dock .rchip{display:flex!important}
body.narrow.nwsheet #dock #undoBtn{grid-column:1/-1;order:-2}
body.narrow.nwsheet #dock #pickCur{grid-column:1/-1;order:-1}
body.narrow.nwsheet #dock .hintbar{grid-column:1/-1;order:99;min-height:0;display:block!important;font-size:13px!important}
@keyframes nwUp{from{transform:translateY(100%)}to{transform:none}}
/* 座位表三模式（DB.narrowSeat）：nwfit＝整頁 fit（預設，照座位表欄×行一頁睇晒）；nwflow＝自動排 3 張一行；nwkeep＝保持欄數＋橫碌 */
body.narrow .seatbar{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding-bottom:5px;scrollbar-width:thin}
body.narrow .seatbar>*{flex:0 0 auto;white-space:nowrap}
body.narrow .seathint{display:none}
body.narrow.nwflow #sg{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))!important;gap:8px}
body.narrow.nwflow #v-seat:not(:has(.editwarn)) #sg .seat.empty{display:none}
body.narrow.nwkeep #sg{max-width:none;gap:8px}
body.narrow:not(.nwfit) #sg .seat{min-height:0;padding:5px 3px 6px}
body.narrow:not(.nwfit) #sg .sav>img,body.narrow:not(.nwfit) #sg .sav>svg,body.narrow:not(.nwfit) #sg .sav .chb{width:58px!important;height:81px!important}
body.narrow:not(.nwfit) #sg .snm{font-size:15px!important;font-weight:900;white-space:normal;overflow-wrap:anywhere;line-height:1.15}
body.narrow:not(.nwfit) #sg .snmen{font-size:12.5px!important}
body.narrow:not(.nwfit) #sg .slv{font-size:13px!important;gap:0 6px}
body.narrow:not(.nwfit) #sg .slv .co{width:1.05em;height:1.05em}
body.narrow:not(.nwfit) #sg .sinfo{width:34px!important;height:34px!important;line-height:32px!important;font-size:17px!important}
/* 整頁 fit：JS（nwFit）寫 --cw／--ch 落 #sg，格仔剛好填滿視窗；卡內容全部跟格仔大細比例 */
body.narrow.nwfit:has(#v-seat.on) main{padding:4px 2px 4px!important}
body.narrow.nwfit:not(.nwtools) #v-seat .seatbar{display:none}
body.narrow.nwfit #v-seat .board{font-size:10px;line-height:13px;padding:0 4px;border-width:1px;border-radius:5px;margin:2px auto 0;box-shadow:none}
body.narrow.nwfit #v-seat .editwarn{margin:0 0 4px;padding:4px 6px;font-size:12px}
body.narrow.nwfit #v-seat .adv-ban:not(.nwopen){height:33px;margin-bottom:3px}
body.narrow.nwfit .seatwrap{scrollbar-gutter:auto;overflow:hidden;transition:none}
body.narrow.nwfit #sg{--nf:clamp(13px,calc(var(--cw,64px) * .21),18px);--lf:clamp(11px,calc(var(--cw,64px) * .17),14px);
 --ph:max(20px,calc(var(--ch,90px) - var(--nf) * 1.12 - var(--lf) * 1.18 - 12px));
 gap:2px;max-width:none;justify-content:center;grid-auto-rows:var(--ch,90px)}
body.narrow.nwfit #sg .seat{min-height:0;padding:1px;border-width:2px;border-radius:6px;overflow:hidden;box-sizing:border-box;
 display:flex;flex-direction:column;align-items:stretch;justify-content:center}
body.narrow.nwfit #sg .sav{flex:0 0 auto;height:var(--ph);display:flex;justify-content:center;align-items:flex-end;line-height:0}
body.narrow.nwfit #sg .sav>img,body.narrow.nwfit #sg .sav>svg,body.narrow.nwfit #sg .sav .chb{height:var(--ph)!important;width:calc(var(--ph) * .7164)!important}
body.narrow.nwfit #sg .snm{flex:0 0 auto;font-size:var(--nf);font-weight:900;line-height:1.12;white-space:nowrap;overflow:hidden;text-overflow:clip;margin:0}
body.narrow.nwfit #sg .snmen,body.narrow.nwfit #sg .sjob,body.narrow.nwfit #sg .slv .stars{display:none}
body.narrow.nwfit #sg .slv{flex:0 0 auto;font-size:var(--lf);line-height:1.18;flex-wrap:nowrap;justify-content:safe center;gap:0 3px;overflow:hidden;letter-spacing:-.3px}
body.narrow.nwfit #sg .slv .co{width:.9em;height:.9em;margin-right:1px}
body.narrow.nwfit #sg .slv .nwlv i{font-style:normal;font-size:.72em;margin-right:.5px}
body.narrow.nwfit #sg .sbar{display:block;flex:0 0 3px;height:3px;margin:1px 3px 0;border:0;border-radius:2px}
body.narrow.nwfit #sg .sinfo{width:18px;height:18px;line-height:16px;font-size:10px;left:0;top:0;border-width:1px;opacity:.85}
body.narrow.nwfit #sg .sflag{font-size:10px;top:0;right:1px}
body.narrow.nwfit #sg .adv-x2,body.narrow.nwfit #sg .adv-sh,body.narrow.nwfit #sg .adv-xp,body.narrow.nwfit #sg .adv-x1{font-size:9px;padding:0 2px;left:1px;bottom:5px;border-width:1px;border-radius:5px;line-height:1.2}
body.narrow.nwfit #sg .adv-sh{left:auto;right:1px}body.narrow.nwfit #sg .adv-xp{bottom:19px}body.narrow.nwfit #sg .adv-x1{left:auto;right:1px;bottom:19px}
body.narrow.nwfit #sg .seat.empty .splus{font-size:18px;line-height:1;margin:auto}
/* 探險橫額：收做一行，撳一下展開 */
body.narrow .adv-ban:not(.nwopen){min-height:0;max-height:40px;padding:3px 10px;gap:6px;border-radius:14px;margin-bottom:8px;cursor:pointer;box-shadow:0 3px 0 #0c0628}
body.park.narrow .adv-ban:not(.nwopen){box-shadow:0 3px 0 var(--ink)}
body.narrow .adv-ban:not(.nwopen) .adv-pic,body.narrow .adv-ban:not(.nwopen) .adv-sw,body.narrow .adv-ban:not(.nwopen) .adv-nx,
body.narrow .adv-ban:not(.nwopen) .adv-lg,body.narrow .adv-ban:not(.nwopen) .adv-ms{display:none!important}
body.narrow .adv-ban:not(.nwopen) .adv-main{display:flex;align-items:center;gap:6px;flex:1 1 auto;min-width:0}
body.narrow .adv-ban:not(.nwopen) .adv-h{flex:1 1 auto;min-width:0;flex-wrap:nowrap}
body.narrow .adv-ban:not(.nwopen) .adv-h b{display:block;font-size:14px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.narrow .adv-ban:not(.nwopen) .adv-bar{flex:0 0 64px;height:12px!important;margin:0 50px 0 0!important;overflow:visible;border-width:2px}
body.narrow .adv-ban:not(.nwopen) .adv-bar span{left:calc(100% + 5px);right:auto!important;top:-3px;font-size:12px!important;line-height:14px!important;color:inherit;text-shadow:none;white-space:nowrap}
body.narrow .adv-ban:not(.nwopen) .adv-main::after{content:'▾';flex:0 0 auto;font-weight:900;opacity:.7}
body.narrow .adv-ban.nwopen{cursor:pointer}

 box-shadow:0 0 12px #fff;transform:translate(-50%,-50%) rotate(var(--r,-35deg)) scaleX(0);animation:bfxSl .32s ease-out forwards}
@keyframes bfxSl{0%{transform:translate(-50%,-50%) rotate(var(--r)) scaleX(0);opacity:1}60%{transform:translate(-50%,-50%) rotate(var(--r)) scaleX(1.1);opacity:1}100%{transform:translate(-50%,-50%) rotate(var(--r)) scaleX(1.2);opacity:0}}

@keyframes bfxGold{0%{opacity:0}25%{opacity:1}100%{opacity:0}}

 background:linear-gradient(#3b2a1a0f 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,#3b2a1a0f 1px,transparent 1px) 0 0/24px 24px,#f6ead2eb;font-family:'Noto Sans TC','Microsoft JhengHei',system-ui,sans-serif;color:#3b2a1a}

body:not(.park) .bfx-ban,body:not(.park) .bfx-cn,body:not(.park) .bfx-cd{background:#2a1a55;border-color:#6f45e0;color:#fff;box-shadow:0 4px 0 #1d0d4d}

function sparkle(x,y,r,c){return `<path d="M${x},${y-r} L${x+r*.28},${y-r*.28} L${x+r},${y} L${x+r*.28},${y+r*.28} L${x},${y+r} L${x-r*.28},${y+r*.28} L${x-r},${y} L${x-r*.28},${y-r*.28} Z" fill="${c}"/>`}
function flower(x,y,r,p,c){let s='';for(let i=0;i<5;i++){const a=i*72*Math.PI/180;
 s+=`<circle cx="${(x+Math.cos(a)*r).toFixed(1)}" cy="${(y+Math.sin(a)*r).toFixed(1)}" r="${(r*.72).toFixed(1)}" fill="${p}"/>`}
 return s+`<circle cx="${x}" cy="${y}" r="${(r*.6).toFixed(1)}" fill="${c}"/>`}

 /* ===== 少女：t=1 短髮短裙 / 2 雙馬尾中裙 / 3 長髮禮服 =====

 const t=(f>=3&&b)?Math.min(f-2,3):1;
 const OL=HS(h,42,22),ACL=HS((h+40)%360,80,72),ACC2=HS((h+40)%360,70,58);
 const ac=b?ACC[b.id][t-1]():null;

function toCell(im,sx,sy,sw,sh){const W=260,H=Math.round(W*1.4);

 const s=Math.min(W/sw,H/sh),dw=sw*s,dh=sh*s;

function attStats(st){
 const ds=attDates();let p=0,l=0,a=0;
 ds.forEach(d=>{const v=attOf(st,d);if(v==='p')p++;else if(v==='l')l++;else if(v==='a')a++});
 const n=ds.length;
 return{n,p,l,a,rate:n?Math.round((p+l)/n*100):0}}
function trendOf(st){
 const H=(st.wkHist||[]).slice(-8).concat([{k:weekKey(),e:wkE(st),d:wkD(st)}]);
 if(H.length<4)return null;
 const half=Math.floor(H.length/2);
 const avg=a=>a.reduce((x,y)=>x+num(y.e,0),0)/(a.length||1);
 const p=avg(H.slice(0,half)),q=avg(H.slice(half));
 return{early:Math.round(p),late:Math.round(q),
  pct:p?Math.round((q-p)/p*100):(q>0?100:0),weeks:H.length}}
function trendWord(t){
 if(!t)return '';
 if(t.pct>=25)return '明顯進步';
 if(t.pct>=8)return '穩步進步';
 if(t.pct<=-25)return '近排明顯退咗';
 if(t.pct<=-8)return '近排稍為退咗';
 return '表現平穩'}

 const A=attStats(st),parts=[];
 if(sumMode==='parent'){
  if(A.n)parts.push('出席率 '+A.rate+'%'+(A.a?'（缺席 '+A.a+' 日'+(A.l?'、遲到 '+A.l+' 次':'')+'）':(A.l?'（遲到 '+A.l+' 次）':'')));
  parts.push('課堂上主動參與過 '+(st.tot||0)+' 日');
  if((st.stk||0)>=3)parts.push('最近連續 '+st.stk+' 日都有份出力');
  const t=trendOf(st),w=trendWord(t);
  if(w)parts.push(w);
  if(st.wk&&st.wk.help)parts.push('肯主動幫同學');
  return st.name+'：'+parts.join('，')+'。'}
 const L=lvOf(st.exp),b=BRI(st.br),t=trendOf(st);
 if(A.n)parts.push('已點名 '+A.n+' 日，出席 '+(A.p+A.l)+' 日（'+A.rate+'%）'
   +(A.l?'，遲到 '+A.l+' 次':'')+(A.a?'，缺席 '+A.a+' 次':''));
 parts.push('喺課堂上主動參與過 '+(st.tot||0)+' 日，累積 '+st.exp+' 分');
 if((st.stk||0)>=3)parts.push('最近連續 '+st.stk+' 日都有出過力');
 parts.push('本週得 '+wkE(st)+' 分、出場 '+wkD(st)+' 日');
 if(t)parts.push('近 '+t.weeks+' 週趨勢：'+trendWord(t)+'（前段每週平均 '+t.early+' 分 → 近段 '+t.late+' 分）');
 if(st.wk&&st.wk.help)parts.push('本週主動送咗 '+st.wk.help+' 次金幣幫同學');
 parts.push('課堂角色已經去到 Lv.'+L.lv+'「'+stageName(st)+'」'+(b?'（'+b.n+'）':''));
 if(st.pet)parts.push('養緊「'+petName(st)+'」');
 if((st.gen||0)>0)parts.push('已經完成 '+st.gen+' 次傳承轉生');
 return st.name+'：'+parts.join('；')+'。'}

/* ================= 寵物扭蛋機／圖鑑／融合（gacha） =================
   資料：st.pets={p1:2,...}（擁有數量，含重複）、st.pexp={p1:exp}（每隻寵物自己嘅經驗，換出戰都保留）、
        st.pity（自上次 ★4+ 起計抽數）、st.pulls（總抽數）。st.pet 仍然係「出戰／跟身」嗰隻。
   p5–p8 本身係 ITEMS 入面嘅寵物道具，喺度加入 PETS 做「扭蛋限定」寵物（寵物店唔賣）。 */
[{id:'p5',n:'小狐狸',p:85,t:['小狐狸','九尾狐','天狐']},
 {id:'p6',n:'小獨角獸',p:130,t:['小獨角獸','彩虹獨角獸','聖光天馬']},
 {id:'p7',n:'小鳳凰',p:260,t:['火雛鳥','烈焰鳳凰','不死鳳凰']},
 {id:'p8',n:'小星靈',p:540,t:['小星靈','銀河星靈','星辰之神']}].forEach(p=>{if(!PETI(p.id))PETS.push(p)});
const G_STAR={p1:1,p2:1,p3:2,p5:2,p6:3,p4:4,p7:4,p8:5};
const G_W=[45,30,17,6.5,1.5],G_PITY=30,G_ONLY={p5:1,p6:1,p7:1,p8:1};
const G_EGG=['#7fd0ff','#5ee66b','#c77dff','radial-gradient(circle at 35% 30%,#fff6c0,#ffd23d 45%,#e09a00)',
 'linear-gradient(135deg,#ff5ea8,#ffd23d,#5ee66b,#48e5ff,#c77dff)'];
const gStar=id=>G_STAR[id]||Math.max(1,Math.min(5,((IT(id)||{}).r)||1));
const gOnly=id=>!!G_ONLY[id];
const gStars=s=>'★'.repeat(s);
const gCost=n=>{const one=Math.max(1,Math.round(10*priceK()));return n>=10?one*9:one*n};
function gSync(st){if(!st)return st;
 if(!st.pets||typeof st.pets!=='object')st.pets={};
 if(!st.pexp||typeof st.pexp!=='object')st.pexp={};
 st.pity=Math.max(0,Math.min(G_PITY-1,Math.round(num(st.pity,0))));
 st.pulls=Math.max(0,Math.round(num(st.pulls,0)));
 if(st.pet&&PETI(st.pet.id)){const id=st.pet.id;if(!(st.pets[id]>0))st.pets[id]=1;
  const m=Math.max(num(st.pexp[id],0),num(st.pet.exp,0));st.pet.exp=m;st.pexp[id]=m}
 return st}
function gNorm(st,s){s=s||{};st.pets={};st.pexp={};
 if(s.pets&&typeof s.pets==='object')Object.keys(s.pets).forEach(k=>{const v=Math.round(num(s.pets[k],0));if(PETI(k)&&v>0)st.pets[k]=Math.min(9999,v)});
 if(s.pexp&&typeof s.pexp==='object')Object.keys(s.pexp).forEach(k=>{const v=Math.round(num(s.pexp[k],0));if(PETI(k)&&v>0)st.pexp[k]=v});
 st.pity=s.pity;st.pulls=s.pulls;return gSync(st)}

function affordable(st){return ITEMS.filter(it=>!st.inv.includes(it.id)&&st.coins>=Math.round(PPS(it)*0.8))}
function pickModal(st,after){
 const pool=affordable(st);
 if(!pool.length){alertM('金幣唔夠買任何一件新裝備（最平 '+Math.round(Math.min.apply(null,ITEMS.map(i=>PPS(i)))*0.8)+' 金幣）');return}
 const pick=[];const p2=pool.slice();
 while(pick.length<3&&p2.length){pick.push(p2.splice(Math.floor(Math.random()*p2.length),1)[0])}
 modal(`<h2>🎁 ${esc(st.name)}，自己揀一件！</h2>
  <div class="center dim">你有 <span class="co"></span>${st.coins}　自己揀嘅有 <b style="color:var(--gold)">八折</b><br>唔想出聲？舉 <b style="color:var(--cyan)">1 / 2 / 3</b> 隻手指，或者指一指都得</div>
  <div class="mini" id="pk"></div>
  <div class="row"><button class="chip" id="pkRnd">🎲 隨機幫我揀</button><button class="nb" id="pkRe">🔄 換三件（-5 金幣）</button><button class="nb" onclick="closeM()">遲啲先</button></div>`,()=>{
  const w=$('#pk'),acts=[];
  pick.forEach((it,ix)=>{const cost=Math.round(PPS(it)*0.8);const e=document.createElement('div');
   e.className='it r'+it.r+(st.coins>=cost?'':' dead');
   e.innerHTML=`<div style="font-size:30px;font-weight:900;color:var(--cyan);line-height:1">${'①②③'[ix]||(ix+1)}</div>`+itemHTML(it,74,st.hue)+`<div><b>${it.n}</b></div><div style="color:var(--gold)"><span class="co"></span>${cost}</div>`;
   const go=()=>{if(st.coins<cost){sBad();toast('唔夠錢');return}
    st.coins-=cost;if(!st.inv.includes(it.id))st.inv.push(it.id);st.eq[it.slot]=it.id;
    save();sUp();confetti(150);closeM();
    modal(`<h2>🎉 揀咗！</h2><div class="center">${itemHTML(it,110,st.hue)}
     <div style="font-size:22px;font-weight:900">${esc(st.name)} 揀咗<br><span style="color:var(--gold)">${it.n}</span></div></div>
     <div class="row"><button class="chip big2" id="pkok">好嘢！</button></div>`,()=>{$('#pkok').onclick=()=>{closeM();after&&after()}});
    render()};
   e.onclick=go;acts.push({can:st.coins>=cost,go});
   w.appendChild(e)});
  $('#pkRnd').onclick=()=>{const ok=acts.filter(a=>a.can);
   if(!ok.length){sBad();toast('金幣唔夠');return}
   ok[Math.floor(Math.random()*ok.length)].go()};
  $('#pkRe').onclick=()=>{if(st.coins<5){toast('唔夠錢換');return}st.coins-=5;save();pickModal(st,after)}})}

const TEAMCOL=['#ff6b81','#4dabf7','#ffd43b','#69db7c','#b197fc','#ff922b'];
function teamOf(st){return (st.team>=0&&st.team<S.teams.n)?st.team:-1}
function teamScores(){const a=new Array(S.teams.n).fill(0);
 S.students.forEach(s=>{const t=teamOf(s);if(t>=0)a[t]+=(S.teams.score[t]!==undefined?0:0)});
 return S.teams.score.slice(0,S.teams.n)}
function autoTeams(){const list=S.students.slice().sort((a,b)=>b.exp-a.exp);
 list.forEach((s,i)=>{const row=Math.floor(i/S.teams.n);const j=i%S.teams.n;
  s.team=(row%2===0)?j:(S.teams.n-1-j)});
 save()}
function pickTeamModal(){
 if(!S.students.length){alertM('未有學生');return}
 const autoMax=()=>Math.max(1,Math.ceil(S.students.length/S.teams.n));
 const maxOf=()=>(S.teams.cap>0?S.teams.cap:autoMax());
 let tsel=0;
 const cnt=i=>S.students.filter(s=>teamOf(s)===i).length;
 const draw=()=>{
  const max=maxOf();
  modal(`<h2>🙋 自己揀隊</h2>
   <div class="center dim">每隊最多 <b style="color:var(--gold)">${max}</b> 人，額滿即止。<br>先撳隊伍，再撳同學名——邊個快邊個入到。<br>如果有人執輸入唔到，老師可以喺下面 <b>＋</b> 加返個位。</div>
   <div class="row"><span class="tag">每隊上限 <b>${max}</b>${S.teams.cap>0?'':'（自動）'}</span>
    <button class="nb" id="ptCm">−</button><button class="nb" id="ptCp">＋</button>
    <button class="nb" id="ptCa">🔄 自動</button></div>
   <div class="row" id="tl"></div>
   <h3>仲未入隊（${S.students.filter(s=>teamOf(s)<0).length} 人）</h3><div class="avrow" id="uL"></div>
   <h3>已入隊（撳一下退隊）</h3><div class="avrow" id="dL"></div>
   <div class="row"><button class="nb" id="ptFill">🔀 洗牌分配剩返嘅同學</button>
    <button class="nb" id="ptClr">🗑 全部退隊</button><button class="chip big2" id="ptDone">完成</button></div>`,()=>{
   $('#ptCp').onclick=()=>{S.teams.cap=maxOf()+1;save();draw()};
   $('#ptCm').onclick=()=>{S.teams.cap=Math.max(1,maxOf()-1);save();draw()};
   $('#ptCa').onclick=()=>{S.teams.cap=0;save();draw()};
   $('#ptFill').onclick=()=>{
    const left=S.students.filter(s=>teamOf(s)<0);
    if(!left.length){toast('個個都入咗隊');return}
    /* 連已入隊嘅同學一齊洗牌重分，咁就冇人分得出邊個係自己撳、邊個係被自動派 */
    const inT=S.students.filter(s=>teamOf(s)>=0);
    const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}return a};
    const mix=shuffle(inT.slice()).slice(0,Math.min(inT.length,left.length+2));
    const pool=shuffle(left.concat(mix));
    pool.forEach(s=>s.team=-1);
    pool.forEach(s=>{let best=0;for(let i=1;i<S.teams.n;i++)if(cnt(i)<cnt(best))best=i;
     if(cnt(best)>=maxOf())S.teams.cap=maxOf()+1;
     s.team=best});
    save();draw();toast('🔀 已經重新洗牌分隊')};
   const tw=$('#tl');
   for(let i=0;i<S.teams.n;i++){const b=document.createElement('button');
    b.className='nb'+(i===tsel?' on':'');b.style.borderColor=TEAMCOL[i];
    b.innerHTML=`<span class="tdot" style="background:${TEAMCOL[i]}"></span> ${esc(S.teams.names[i]||('隊'+(i+1)))} ${cnt(i)}/${max}`;
    b.onclick=()=>{tsel=i;draw()};tw.appendChild(b)}
   const uw=$('#uL');
   S.students.filter(s=>teamOf(s)<0).forEach(s=>{const e=document.createElement('div');e.className='mini-av new';
    e.innerHTML='<div class="av"></div><b>'+esc(s.name)+'</b><em>未入隊</em>';
    drawChar(e.querySelector('.av'),s,3);
    e.onclick=()=>{if(cnt(tsel)>=maxOf()){sBad();toast('「'+(S.teams.names[tsel]||('隊'+(tsel+1)))+'」爆滿喇——揀第二隊，或者叫老師撳 ＋ 加個位');return}
     s.team=tsel;save();bp(900,.06);draw()};uw.appendChild(e)});
   const dw=$('#dL');
   S.students.filter(s=>teamOf(s)>=0).forEach(s=>{const e=document.createElement('div');e.className='mini-av';
    e.innerHTML='<div class="av"></div><b>'+esc(s.name)+'</b><em><span class="tdot" style="background:'+TEAMCOL[s.team]+'"></span>'+esc(S.teams.names[s.team]||'')+'</em>';
    drawChar(e.querySelector('.av'),s,3);
    e.onclick=()=>{s.team=-1;save();draw()};dw.appendChild(e)});
   $('#ptClr').onclick=()=>{S.students.forEach(s=>s.team=-1);save();draw()};
   $('#ptDone').onclick=()=>{closeM();render();teamModal()}})};
 draw()}

  $('#tmOn').onclick=()=>{S.teams.on=!S.teams.on;save();teamModal();render();

/* ================= 課室黑板（投影出去嗰塊） =================
   一版過解決「今日做緊乜」：大字訊息、倒數計時、今日班務打勾。
   班務打勾會即刻派分畀負責嗰位同學，唔使返去班級版再撳多次。 */
const DEFDUTY=[{ic:'🧹',n:'掃地',e:3},{ic:'🧽',n:'擦黑板',e:3},{ic:'📚',n:'派簿',e:3},
 {ic:'🪟',n:'閂窗關燈',e:3},{ic:'🗑️',n:'倒垃圾',e:3},{ic:'🌱',n:'淋花',e:2}];
let tkEnd=0,tkLeft=0,tkRun=false,tkT=null;
function boardFix(){
 if(!S.board||typeof S.board!=='object')S.board={msg:'',items:[],day:'',min:5};
 if(!Array.isArray(S.board.items))S.board.items=[];
 if(S.board.day!==TD()){S.board.day=TD();S.board.items.forEach(i=>{i.done=false});save()}}
const dutyWho=it=>S.students.find(s=>s.id===it.who)||null;
function boardTick(it){
 boardFix();
 if(it.done){it.done=false;save();renderBoard();return}
 it.done=true;
 const st=dutyWho(it);
 if(st){const g=applyOne(st,Math.max(0,it.e|0));
  if(g.evo&&g.form>=2&&!st.br&&needJob(st)&&!pendingJob.includes(st.id))pendingJob.push(st.id);
  undoStack.push({rid:S.id,list:[{id:st.id,e:Math.max(0,it.e|0)}],label:'班務'});
  sUp();toast('✅ '+esc(st.name)+' 做咗「'+esc(it.n)+'」 +'+it.e+' 分')}
 else{sHit();toast('✅ '+esc(it.n)+' 做完（冇指定負責人，唔派分）')}
 save();renderBoard();render()}
function tkFmt(ms){const s=Math.max(0,Math.ceil(ms/1000));
 return String((s/60)|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function tkStop(){tkRun=false;clearInterval(tkT);tkT=null}
function tkSet(min){tkStop();tkLeft=Math.max(1,Math.round(min*60))*1000;tkPaint()}
function tkGo(){
 if(tkRun){tkLeft=tkEnd-Date.now();tkStop();tkPaint();return}
 if(tkLeft<=0)tkSet(S.board&&S.board.min?S.board.min:5);
 tkEnd=Date.now()+tkLeft;tkRun=true;
 tkT=setInterval(()=>{
  const l=tkEnd-Date.now();
  if(l<=0){tkStop();tkLeft=0;tkPaint();
   try{sUp();confetti(150)}catch(e){}
   toast('⏰ 時間到！')}
  else{tkLeft=l;tkPaint()}},250);
 tkPaint()}
function tkPaint(){
 const e=$('#tkNum');if(e){e.textContent=tkFmt(tkLeft);

/* ================= 拔河對戰 ================= */
/* 用返「小隊對戰」嗰套隊伍，揀兩隊出嚟對拉。
   五個屬性喺度全部落到地：⚔️力量加拉力、📖智慧暴擊、🍀幸運超級一拉、
   🛡️守護幫自己隊頂住對面、✨魅力夠齊心就成隊一齊爆發。 */
const TUGD=[{ic:'🌤️',n:'熱身',k:4,d:'一堂之內分到勝負'},
 {ic:'⚔️',n:'正常',k:8,d:'一兩堂'},
 {ic:'🔥',n:'地獄',k:15,d:'成個星期嘅班級目標'}];
let tugA=-1,tugB=-1;
const tugSide=i=>S.students.filter(s=>teamOf(s)===i);
const tugNm=i=>(S.teams.names[i]||('隊'+(i+1)));
function tugStat(list,k){if(!list.length)return 0;let v=0;
 list.forEach(s=>{try{v+=statsOf(s)[k]}catch(e){}});return v/list.length}
/* 一隊平均一拉幾多 */
function tugAvgPull(list){
 if(!list.length)return 1;let v=0;
 list.forEach(s=>{try{v+=Math.max(1,Math.round((S.rewards[actR]||{e:5}).e*(S.dbl?2:1)*(1+statsOf(s).pow/120)))}catch(e){}});
 return Math.max(1,v/list.length)}
/* 目標＝要比對手多贏幾多次先拉得過界。拔河係零和，所以用「淨勝次數」計，
   老師睇個數就知今堂玩唔玩得完。 */
function tugSizeK(a,b){
 /* 隊伍愈大，一個回合嘅拉力愈多。唔跟人數調，20 人班撳一次「全隊一齊拉」
    連地獄都即刻完，成件事變咗冇懸念。 */
 const n=Math.min(tugSide(a).length,tugSide(b).length);
 return Math.max(1,Math.min(2.5,n/5))}
function tugTarget(a,b,k){
 const p=(tugAvgPull(tugSide(a))+tugAvgPull(tugSide(b)))/2;
 return Math.max(20,Math.round(p*k*tugSizeK(a,b)))}
/* 老師睇嘅數：要比對手多贏幾多次 */
const tugWins=(a,b,k)=>Math.max(1,Math.round(k*tugSizeK(a,b)));
function tugGo(a,b,d){
 const t=tugTarget(a,b,d.k);
 S.tug={t:[a,b],pos:0,max:t,c:{},f:{},burst:[false,false],n:0,
  rush:Math.max(6,Math.round(S.students.length*2.5)),df:d.ic+' '+d.n};
 save();sUp();render()}

function tugPull(st,side,el,silent){
 const T=S.tug;if(!T)return;
 const me=T.t[side],opp=T.t[1-side];
 const first=!T.f[st.id];
 const o=(()=>{try{return statsOf(st)}catch(e){return{pow:0,wis:0,luk:0}}})();
 const base=S.rewards[actR].e*(S.dbl?2:1)*(first?2:1);
 const crit=Math.random()<Math.min(.6,o.wis/700);
 const luck=Math.random()<Math.min(.25,o.luk/420);
 const rush=T.n>=T.rush;
 /* 對面成隊嘅「守護」會頂住，拉唔郁咁多 */
 const dfn=tugStat(tugSide(opp),'def');
 let d=base*(1+o.pow/120)*(crit?2:1)*(luck?1.8:1)*(rush?2:1)/(1+dfn/300);
 d=Math.max(1,Math.round(d));
 T.f[st.id]=1;T.c[st.id]=(T.c[st.id]||0)+d;T.n=(T.n||0)+1;
 T.pos+=(side===0?d:-d);
 markJoin(st);
 if(el)fly(el,(luck?'🍀':crit?'💥':'')+'+'+d+(first?' 首拉×2':(crit?' 暴擊×2':(luck?' 超級一拉':''))),
  luck?'#7dff9a':crit?'#ffd23d':'#ffffff');
 if(crit&&!silent)sUp();
 /* ✨ 齊心：成隊都出過手，一次過大拉 */
 const mine=tugSide(me);
 if(!T.burst[side]&&mine.length&&mine.every(s=>T.f[s.id])){
  T.burst[side]=true;
  const cha=tugStat(mine,'cha');
  const bu=Math.round(T.max*(0.12+Math.min(.13,cha/900)));
  T.pos+=(side===0?bu:-bu);
  mine.forEach(s=>{T.c[s.id]=(T.c[s.id]||0)+Math.round(bu/mine.length)});
  if(!silent){sUp();confetti(160);toast('✨ '+tugNm(me)+' 全隊出齊手，齊心大拉 +'+bu+'！')}}
 save();
 if(Math.abs(T.pos)>=T.max){tugWin();return}
 if(!silent){sHit();renderTug();
  const k=document.querySelector('#tgArena .tugknot');
  if(k){k.classList.remove('sh2');void k.getBoundingClientRect();k.classList.add('sh2')}}}
function tugWin(){
 const T=S.tug;if(!T)return;
 const win=T.pos>0?0:1,wi=T.t[win],li=T.t[1-win];
 S.tug=null;
 const wl=tugSide(wi),ll=tugSide(li);
 const prize=Math.max(5,Math.round(T.max*0.15)),cons=Math.max(2,Math.round(prize*0.45));
 const top=list=>{let b=null;list.forEach(s=>{if(!b||(T.c[s.id]||0)>(T.c[b.id]||0))b=s});return b};
 const mvpW=top(wl),mvpL=top(ll),log=[];
 const give=(s,g)=>{const r=applyOne(s,g);
  if(r.evo&&r.form>=2&&!s.br&&needJob(s)&&!pendingJob.includes(s.id))pendingJob.push(s.id);
  log.push({id:s.id,e:g})};
 wl.forEach(s=>give(s,prize+(mvpW&&s.id===mvpW.id?3:0)));
 ll.forEach(s=>give(s,cons+(mvpL&&s.id===mvpL.id?3:0)));
 if(log.length)undoStack.push({rid:S.id,list:log,label:'拔河獎'});
 save();sUp();confetti(260);
 modal(`<h2>🤼 ${esc(tugNm(wi))} 拉贏喇！</h2>
  <div class="center" style="font-size:22px;font-weight:900;color:${TEAMCOL[wi]}">🏆 ${esc(tugNm(wi))}</div>
  <div class="center dim">贏嗰隊每人 +${prize} 分　${esc(tugNm(li))} 每人 +${cons} 分（出過力就唔會白做）</div>
  ${mvpW?`<div class="center" style="color:var(--gold);font-weight:900;margin-top:6px">💪 ${esc(tugNm(wi))} 最落力：${esc(mvpW.name)}（+3）</div>`:''}
  ${mvpL?`<div class="center" style="color:var(--cyan);font-weight:900">💪 ${esc(tugNm(li))} 最落力：${esc(mvpL.name)}（+3）</div>`:''}
  <div class="row"><button class="chip big2" onclick="closeM()">恭喜！</button></div>`);
 render()}

 {const f=$('#dock');

/* ================= 參與度 ================= */
const TD=()=>dayStr(0);
const joined=st=>st.day===TD();
const joinCount=()=>S.students.filter(joined).length;
function avgExp(){if(!S.students.length)return 0;return S.students.reduce((a,b)=>a+b.exp,0)/S.students.length}
function bonusOf(st){
 const tags=[];let m=1;
 const gc=Math.min(st.gen||0,2);
 if(gc>0){m*=1+gc*0.1;tags.push('🎓+'+(gc*10)+'%')}
 if(st.bless>0){m*=1+st.bless*0.05;tags.push('⭐+'+(st.bless*5)+'%')}
 if(st.pet&&petStage(petLv(st.pet.exp).lv)>=2){m*=1.2;tags.push('🐾反哺+20%')}
 if(S.dbl){m*=2;tags.push('⚡×2')}
 if(!joined(st)){m*=2;tags.push('🌟首次×2')}
 else if(S.students.length>=3&&st.exp<avgExp()*0.7){m*=1.5;tags.push('🔥追趕')}
 return{m,tags}}
function markJoin(st){
 if(joined(st)){st.dn++;return}
 /* 「連續」計嘅係【上堂日】，唔係日曆日。
    放假、周末、老師冇開機都唔應該當學生斷咗 —— 佢阻止唔到。
    S.prevAct = 對上一個真係有人出場嘅日子。 */
 if(S.lastAct!==TD()){S.prevAct=S.lastAct||'';S.lastAct=TD()}
 const cont=(st.day&&(st.day===S.prevAct||st.day===dayStr(-1)));
 if(cont)st.stk=(st.stk||0)+1;
 else if(st.day&&(st.stk||0)>=3)st.stk=Math.max(1,Math.floor(st.stk/2));
 else st.stk=1;
 st.day=TD();st.dn=1;st.tot++;wkBump(st,0,'day');
 if(st.stk>0&&st.stk%5===0){st.coins+=15;toast('🔥 '+st.name+' 連續參與 '+st.stk+' 日！+15 金幣')}
 checkGoal()}
function classHist(){
 S.hist=Array.isArray(S.hist)?S.hist:[];
 const d=TD();let h=S.hist[S.hist.length-1];
 if(!h||h.d!==d){h={d,avg:0,join:0};S.hist.push(h);if(S.hist.length>60)S.hist.shift()}
 const t=S.students.length||1;
 h.join=joinCount();
 h.avg=Math.round(S.students.reduce((a,s)=>a+(s.day===d?(s.dn||0):0),0)/t*10)/10;
 return S.hist}
function histTxt(){
 const H=classHist();if(H.length<2)return '';

function applyOne(st,amt){
 const b=lvOf(st.exp),bf=formOf(b.lv),bs=starsOf(b.lv);
 st.exp=Math.max(0,st.exp+amt);st.coins=Math.max(0,st.coins+amt);
 const a=lvOf(st.exp),af=formOf(a.lv),as=starsOf(a.lv);
 return{up:a.lv>b.lv,evo:af>bf,form:af,star:(af===bf&&as>bs)?as:0}}

function afterGain(st,res,silent){
 if(res.evo&&res.form>=2&&!st.br&&needJob(st)){if(!pendingJob.includes(st.id))pendingJob.push(st.id);return'job'}

 if(res.star){
  st.coins+=STARCOIN;

     只有儲滿 3 粒（＝下一級就進化）先慶祝，嗰下係好消息。 */
  const SF=starFxLv();
  if(!silent&&SF>0&&(res.star>=3||SF>=2))setTimeout(()=>{sUp();if(!DB.calm&&fxLevel()>0)confetti(res.star>=3?70:40);
   toast(res.star>=3
    ?('⭐⭐⭐ '+st.name+' 三粒星儲滿，下一級就進化！+'+STARCOIN+' 金幣')
    :('⭐ '+st.name+' 儲到第 '+res.star+' 粒星！+'+STARCOIN+' 金幣'))},180)
  else if(!silent&&SF>0&&fxLevel()>0)bp(1046,.09,'triangle',.05)}
 if(res.up&&!silent&&!DB.calm){setTimeout(sUp,120);confetti(fxLevel()>0?70:26)}
 return''}
function award(st,base,el,silent){
 if(base<0){const e=Math.round(base);
  S.penLog=S.penLog||[];
  S.penLog.push({d:TD(),id:st.id,n:((S.pens[actP]||{}).n)||'',e});
  if(S.penLog.length>300)S.penLog.shift();
  if(!S.penNoScore){applyOne(st,e);undoStack.push({rid:S.id,list:[{id:st.id,e}],label:'扣分'})}
  if(el&&!S.quiet)fly(el,S.penNoScore?'📝':(e+''),'#ff6b6b');
  if(!silent&&!S.quiet)sBad();
  if(S.quiet)quietMark();

  save();return}
 const before=(()=>{try{return statsOf(st)}catch(e){return null}})();
 /* 派獎會連帶郁 markJoin（day/dn/stk/連續獎金）、buff 額外金幣、afterGain 儲星金幣呢啲「唔止 exp/coins by e」嘅
    散裝加幣位，以前 undo 淨係記 e，呢啲漏晒。而家喺任何郁之前先影低相關欄位，undo 時直接還原返個 snapshot，
    唔使逐個加幣位手動補記錄（新加嘅加幣邏輯以後都自動包喺入面，唔會再漏）。 */
 const snap={exp:st.exp,coins:st.coins,stk:st.stk,day:st.day,dn:st.dn,tot:st.tot,
  wk:st.wk?{k:st.wk.k,e:st.wk.e,d:st.wk.d,help:st.wk.help}:null,
  petExp:st.pet?st.pet.exp:undefined};
 const {m,tags}=bonusOf(st);
 let e=Math.round(base*m);
 if(S.fade===1)e=Math.max(1,Math.round(e/2));else if(S.fade>=2)e=0;
 markJoin(st);
 const res=applyOne(st,e);
 if(el)fly(el,'+'+e+(tags.length?' '+tags[tags.length-1]:''),'#ffd23d');
 if(!silent)sGood();
 /* 狀態好 → 額外金幣（只加金幣，唔加 EXP，排名照舊公平） */
 const bp2=buffPct(st);
 if(bp2>0&&e>0){const extra=Math.max(1,Math.round(e*Math.min(.3,bp2/100)));
  st.coins+=extra;if(el)setTimeout(()=>fly(el,'🔥+'+extra+' 金幣','#7df9ff'),260)}
 wkBump(st,e);petGain(st,e);teamAdd(st,e);
 const k=afterGain(st,res,silent);
 undoStack.push({rid:S.id,list:[{id:st.id,e,snap}],label:'派獎'});
 if(undoStack.length>60)undoStack.shift();

 if(res.up&&el&&!silent){

function classFit(){
 const g=$('#grid');if(!g)return;
 if(DB.fitAll===false||view!=='class'||document.body.classList.contains('minimode')){FITV.forEach(k=>document.body.style.removeProperty(k));fitSC=0;return}
 if(!S.students.length)return;
 try{
  fitSC=SC();   /* 啲卡啱啱先用呢個尺寸畫完 */
  const f=$('#dock');
  const top=g.getBoundingClientRect().top;
  const avail=innerHeight-top-((f?Math.round(f.getBoundingClientRect().height):130)+18)-8;
  if(avail<150){FITV.forEach(k=>document.body.style.removeProperty(k));return}
  /* 由大到細逐級試，第一個「塞得落而且個名冇被剪」就用佢。
     唔用二分／比例遞減 —— 實測高度唔係單調（cw 79px 高 559，75px 反而高 643，
     因為欄數同卡入面啲字換行都會跳），二分會揀錯，而且開頁同撳完掣會出兩個唔同大細。
     真係點縮都塞唔落，就寧願留返「個名仲睇得晒」嘅最細尺寸，畀成版碌 —— 
     成班名剪一半嘅話，呢個功能等於冇用。 */
  const H=()=>g.getBoundingClientRect().height;
  /* 量一次要行十幾轉版面（36 人大約 200ms）。同一個班、同一個窗，答案唔會變，
     記住佢，撳排序／重畫就唔使再算。個名一有機會被剪就即刻重新度過。 */
  const key=[S.students.length,innerWidth,innerHeight,Math.round(avail),DB.big?1:0].join('|');
  if(key===fitMemo&&fitK){fitApply(fitK);if(!nameCut())return}
  let best=0,minOK=0;
  for(let x=1;x>=.415;x-=.03){
   fitApply(x);
   if(nameCut())break;
   minOK=x;
   if(H()<=avail){best=x;break}}
  fitK=best||minOK||1;fitMemo=key;
  fitApply(fitK);
 }catch(e){}}

function delStudent(id){
 S.students=S.students.filter(x=>x.id!==id);
 S.picked=S.picked.filter(x=>x!==id);
 sel.delete(id);pendingJob=pendingJob.filter(x=>x!==id);if(seatPick===id)seatPick=null;
 if(S.boss){delete S.boss.c[id];delete S.boss.f[id]}
 if(S.tug){delete S.tug.c[id];delete S.tug.f[id]}
 if(S.board&&S.board.items)S.board.items.forEach(i=>{if(i.who===id)i.who=''})
 if(S.auc&&S.auc.by===id){S.auc.by=null;S.auc.bid=PPA(IT(S.auc.id))}
 if(S.lastWin===id)S.lastWin='';
 undoStack=undoStack.map(b=>({...b,list:b.list.filter(x=>x.id!==id)})).filter(b=>b.list.length);

function wPickIdx(p){
 const w=p.map(s=>joined(s)?1:3),tot=w.reduce((a,b)=>a+b,0);
 let r=Math.random()*tot;

/* ================= 一人一職 ================= */
function jobsFix(){
 if(!Array.isArray(S.jobs))S.jobs=DEFJOB.map(j=>({id:uid(),ic:j.ic,n:j.n,cap:j.cap,pay:j.pay,who:[]}));
 const have={};S.students.forEach(x=>have[x.id]=1);
 S.jobs.forEach(j=>{if(!Array.isArray(j.who))j.who=[];
  j.who=j.who.filter(id=>have[id]);if(j.who.length>j.cap)j.who=j.who.slice(0,j.cap)})}
function jobsOf(st){jobsFix();return S.jobs.filter(j=>j.who.indexOf(st.id)>=0)}
function jobIcons(st){const a=jobsOf(st);return a.length?a.map(j=>j.ic).join(''):''}
function jobSlots(){let n=0;S.jobs.forEach(j=>n+=Math.max(1,j.cap));return n}
function jobNone(){jobsFix();const on={};S.jobs.forEach(j=>j.who.forEach(id=>on[id]=1));
 return S.students.filter(s=>!on[s.id])}
function jobDouble(){jobsFix();const c={};S.jobs.forEach(j=>j.who.forEach(id=>c[id]=(c[id]||0)+1));
 return S.students.filter(s=>(c[s.id]||0)>1)}
function shuf(a){for(let i=a.length-1;i>0;i--){const k=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[k];a[k]=t}return a}
/* 人人有份行先，夠晒先至有人做兩份 */
function jobAuto(){
 jobsFix();
 const slots=[];S.jobs.forEach(j=>{j.who=[];for(let i=0;i<Math.max(1,j.cap);i++)slots.push(j)});
 if(!S.students.length)return;
 let pool=shuf(S.students.map(s=>s.id));
 for(const j of slots){
  if(!pool.length)pool=shuf(S.students.map(s=>s.id));

$('#spin').onclick=()=>{

 const a=Math.PI*2/p.length,idx=(S.wMix===false)?Math.floor(Math.random()*p.length):wPickIdx(p);
 /* 目標角要由「而家個角」起計：以前用絕對角 12π+x，第一次轉完 wAng 已經≈12π+x，
    第二次 target−st0 只剩 <1 圈甚至 0（冇動畫／只轉幾格）。而家：先搵中獎格對準指針
    （1.5π）要補幾多角度（0～2π），再加足 6 圈。 */
 const TAU=Math.PI*2,st0=((wAng%TAU)+TAU)%TAU,need=(((Math.PI*1.5-(idx*a+a/2)-st0)%TAU)+TAU)%TAU,
  target=st0+TAU*6+need,t0=performance.now();let last=0;wAng=st0;
 (function step(t){const k=Math.min(1,(t-t0)/3600),e=1-Math.pow(1-k,4);wAng=st0+(target-st0)*e;renderWheel();
  if(t-last>90){bp(500+Math.random()*300,.03,'square',.03);last=t}
  if(k<1)requestAnimationFrame(step);else{wSpin=false;winner(p[idx])}})(t0)};

function costFor(st,price){

 if(!st.inv.length)m=0.7;

    等於喺呢個畫面畀人踢出局。而家最窮嗰個五折起。 */
 try{const n=S.students.length;
  if(n>=5){const sorted=S.students.slice().sort((a,b)=>a.coins-b.coins);
   const idx=sorted.findIndex(x=>x.id===st.id);
   const q=Math.ceil(n*0.25);
   if(idx>=0&&idx<q)m*=0.5+0.5*(idx/q)}}catch(e){}
 return Math.max(1,Math.round(price*m))}

function suggestHP(mul){
 const bp=classBP(),n=Math.max(1,S.students.length);
 const perHit=Math.max(6,Math.round((S.rewards[actR]||{e:5}).e*(1+(bp/n)/120)));
 return Math.max(60,Math.round(perHit*n*1.6*(mul||1)))}
/* 弱點：呢個學生最強嗰科啱啱係 BOSS 弱點 → 多 60% 傷害。
   六條進化線終於唔係換皮 —— 唔同 BOSS 要唔同線嘅同學出手。 */
function bossWeakMul(st){
 try{const B=S.boss;if(!B||!B.weak)return 1;
  const o=statsOf(st);let best='pow';
  STATS.forEach(x=>{if(o[x.k]>o[best])best=x.k});
  return best===B.weak?1.6:1}catch(e){return 1}}
/* 難度：老師話「同一隻 BOSS，有時想一堂打完，有時想做成個星期嘅班級目標」。
   難度只改血量、反擊密度同寶箱運氣，唔會改個人獎勵比例，所以唔會有人靠揀地獄爆分。 */
const BDIFF=[{ic:'🌤️',n:'熱身',m:.55,rg:12,cb:-.15,d:'一堂之內打得完'},
 {ic:'⚔️',n:'正常',m:1,rg:8,cb:0,d:'一兩堂'},
 {ic:'🔥',n:'地獄',m:1.9,rg:6,cb:.3,d:'成個星期嘅班級目標'}];
function bossBase(i){return i===0?.5:i===1?1:i===2?1.6:2.4}
/* 「每人平均要出手幾多次」——老師靠呢個數決定夠唔夠一堂打完 */
function estHits(hp,d){
 /* 唔用公式估，直接用返真嘅規則行一次（期望值版）：首擊×2、暴擊、全員合擊、
    反擊回血全部計埋。改咗平衡都唔使再對返呢條數。 */
 const n=Math.max(1,S.students.length);if(!S.students.length)return 1;
 let dm=0,cr=0;
 S.students.forEach(x=>{try{const o=statsOf(x);
  dm+=Math.max(1,Math.round(S.rewards[actR].e*(S.dbl?2:1)*(1+o.pow/120)));
  cr+=Math.min(.6,o.wis/700)}catch(e){}});
 const per=Math.max(1,(dm/n)*(1+cr/n));
 const every=Math.max(3,Math.round(n*((d&&d.rg)||8)/12));
 const shMax=clsShield(hp),cap=Math.round(hp*0.5),rd=Math.max(8,Math.round(hp*0.06));
 let cur=hp,sh=shMax,hl=0,k=0,burst=false;
 while(cur>0&&k<n*80){
  k++;
  cur-=per*(k<=n?2:1);
  if(k%every===0){sh-=rd;
   if(sh<=0){const h=Math.max(0,Math.min(Math.round(hp*0.08),cap-hl));hl+=h;cur=Math.min(hp,cur+h);sh=shMax}}
  if(!burst&&k>=Math.ceil(n*0.8)){burst=true;cur-=hp*0.25}}
 return Math.max(.5,Math.round(k/n*10)/10)}
function bossGo(b,hp,d){
 const sh=clsShield(hp);
 S.boss={n:b.n,e:b.e,k:b.k||'',hp,max:hp,c:{},f:{},all:false,sh,shMax:sh,n8:0,luk:0,weak:b.weak||'',
  df:d?d.ic+' '+d.n:'',rg:d?d.rg:8,cb:d?d.cb:0};
 save();sUp();render()}

   const e=document.createElement('button');e.className='chip big2 dfb';
   e.innerHTML=`<div style="font-size:21px">${d.ic} ${d.n}</div>
    <div style="font-size:13px;opacity:.9;font-weight:700">血量 ${hp}<br>每人約出手 ${eh} 次<br>${d.d}</div>`;
   e.onclick=()=>{closeM();bossGo(b,hp,d)};w.appendChild(e)});
  const cb=$('#bdCus');if(cb)cb.onclick=()=>{closeM();
   askM('BOSS 血量（可自訂，1 以上）',suggestHP(bm),x=>{
    if(x===null)return;

    if(!Number.isFinite(hp)||hp<1){alertM('血量要係 1 或以上嘅數字');return}
    bossGo(b,hp,BDIFF[1])},{num:1,hint:'正常難度：'+suggestHP(bm)+'　每人約出手 '+estHits(suggestHP(bm),BDIFF[1])+' 次'})}})}

  ${notYet.length?`<div style="font-size:17px;font-weight:900;color:var(--gold)">仲有 ${notYet.length} 個人未出過手（第一擊 ×2）：${notYet.slice(0,8).map(s=>esc(s.name)).join('、')}${notYet.length>8?'…':''}</div>`

   ${(()=>{const wk=STATS.filter(x=>x.k===B.weak)[0];
     return wk?`<br><b style="color:#ff8a3d">🎯 弱點：${wk.ic}${wk.n} —— 呢科係自己最強一項嘅同學，打佢多 60% 傷害</b>`:''})()}</div></div>

   +'・暴'+Math.round(Math.min(.6,_s.wis/700)*100)+'%'+(bossWeakMul(st)>1?' 🎯':'')+'</em>';
  drawChar(e.querySelector('.av'),st,3);e.onclick=()=>hit(st,e);w.appendChild(e)});

/* 屬性喺 BOSS 戰真係有用：力量加傷、智慧暴擊、守護擋反擊、魅力谷合擊、幸運爆寶箱。
   全部只喺呢個「全班一齊打」嘅場合生效 —— 抽人同拍賣照舊唔受影響，唔會強者更強。 */
function clsShield(maxHp){
 let v=0;S.students.forEach(s=>{try{v+=statsOf(s).def}catch(e){}});
 const avg=v/Math.max(1,S.students.length);
 /* 同 BOSS 血量掛鈎，唔會細班就無敵、大班就一撞即爆；
    守護愈高護盾愈厚 = 反擊愈少爆，但唔會完全唔爆 */
 return Math.max(30,Math.round(Math.max(60,num(maxHp,300))*0.35*(0.55+Math.min(1.1,avg/150))))}
/* 一個回合大約反擊幾多次（唔再寫死「每 8 擊」）——本來 30 人班一個回合就反擊近 4 次，
   地獄難度回血快過全班打，實測 13 個回合都未打得死。 */
function rageEvery(B){return Math.max(3,Math.round(Math.max(1,S.students.length)*(B.rg||8)/12))}
function bossRage(B){
 /* 反擊：輸咗淨係 BOSS 回氣，唔會扣學生任何嘢 */
 if(!B.shMax||!Number.isFinite(B.shMax)){B.shMax=clsShield(B.max);B.sh=B.shMax}
 if(!Number.isFinite(B.sh))B.sh=B.shMax;
 B.n8=(B.n8||0)+1;
 if(B.n8<rageEvery(B))return null;
 B.n8=0;
 const dmg=Math.max(8,Math.round(B.max*0.06));
 B.sh=Math.max(0,(B.sh===undefined?B.shMax:B.sh)-dmg);
 if(B.sh>0)return{dmg,broke:false};
 /* 全場回血封頂五成 —— 保證任何班級、任何難度都一定打得完 */
 const heal=Math.max(0,Math.min(Math.round(B.max*0.08),Math.round(B.max*0.5)-(B.hl||0)));
 B.hl=(B.hl||0)+heal;
 B.hp=Math.min(B.max,B.hp+heal);
 B.sh=B.shMax;            /* 護盾重新撐起，繼續打 */
 return{dmg,broke:true,heal}}
function hit(st,el,silent){
 const B=S.boss;if(!B)return;

 const S1=(()=>{try{return statsOf(st)}catch(e){return{pow:0,wis:0,luk:0}}})();
 const base=S.rewards[actR].e*(S.dbl?2:1)*(first?2:1);
 const crit=Math.random()<Math.min(.6,S1.wis/700);
 const dmg=Math.max(1,Math.round(base*(1+S1.pow/120)*(crit?2:1)*bossWeakMul(st)));
 B.f[st.id]=1;B.hp-=dmg;B.c[st.id]=(B.c[st.id]||0)+dmg;
 B.luk=(B.luk||0)+S1.luk;
 markJoin(st);
 if(el)fly(el,(crit?'💥':'')+'-'+dmg+(first?' 首擊×2':(crit?' 看穿弱點×2':'')),crit?'#ffd23d':'#ff5470');
 if(crit&&!silent)sUp();
 {const rg=bossRage(B);
  if(rg&&!silent){
   if(rg.broke){sBad();toast(rg.heal>0
    ?'🛡️ 班級護盾爆咗！'+esc(B.n)+' 回復 '+rg.heal+' 血，護盾已重新撐起'
    :'🛡️ 護盾爆咗，但 '+esc(B.n)+' 已經冇力再回血！護盾重新撐起，繼續打')}

 if(!silent)sHit();

 if(!B.all&&S.students.length&&S.students.filter(s=>B.f[s.id]).length>=need8){
  B.all=true;

  S.students.forEach(s=>{B.c[s.id]=(B.c[s.id]||0)+Math.round(burst/S.students.length)});

 if(B.hp<=0){bossWin();return}
 if(!silent){renderBoss();const be=$('#be');
  if(be){be.classList.remove('sh');void be.offsetWidth;be.classList.add('sh');
   try{fly(be,(crit?'\uD83D\uDCA5 ':'')+'-'+dmg,crit?'#ffd23d':'#ff5470')}catch(e){}}}}
function bossWin(){
 const B=S.boss;if(!B)return;
 S.boss=null;
 const students=S.students.slice();

  const c=B.c[st.id]||0,share=Math.min(0.5,c/tot),r=Math.max(0,base+Math.round(pool*share));
  const g=applyOne(st,r);if(g.evo&&g.form>=2&&!st.br&&needJob(st)&&!pendingJob.includes(st.id))pendingJob.push(st.id);

 if(tier>=2){

function parseNames(txt){
 return String(txt||'').split(/\r?\n/).map(line=>{
  const cells=line.split(/\t|,|;/).map(x=>x.trim().replace(/^"|"$/g,'')).filter(Boolean);
  if(!cells.length)return '';
  if(cells.length===1)return cells[0];
  /* 「陳大文,Chan Tai Man」→ 中文名 + 英文名一齊入 */
  {const nm2=cells.filter(c=>!/^[0-9]{1,3}$/.test(c));
   if(nm2.length>=2){
    const cn=nm2.find(hasCJK),en=nm2.find(x=>isEn(x)&&!hasCJK(x));
    if(cn&&en)return{n:cn,e:en};
    return{n:nm2[0],e:nm2[1]}}}
  /* Excel 貼落嚟通常係「學號 姓名」或者「班 學號 姓名」——揀最長嗰個非純數字欄，冇就用最後一欄 */
  const named=cells.filter(c=>!/^\d+$/.test(c));
  const pick=named.length?named[named.length-1]:cells[cells.length-1];
  const no=cells.find(c=>/^\d{1,3}$/.test(c));
  return (no&&named.length)?(no+' '+pick):pick;
 }).map(x=>(x&&x.n!==undefined)?{n:String(x.n).trim(),e:String(x.e||'').trim()}:String(x).trim())
  .filter(x=>{const s=(x&&x.n!==undefined)?x.n:x;return s&&!/^(姓名|名字|學生|name|english|english name|英文名|no|學號)$/i.test(s)})}
function renameInOrder(arr){
 const n=Math.min(arr.length,S.students.length);
 if(!n){alertM('冇嘢好改');return}
 const nmOf=x=>String(x&&x.n!==undefined?x.n:x);
 const pre=[];for(let i=0;i<Math.min(n,5);i++)pre.push(S.students[i].name+' → '+nmOf(arr[i]));
 confirmM('按次序灌真名（唔會加新學生）：'+pre.join('、')+(n>5?'…':'')
  +'　共 '+n+' 位'+(arr.length>S.students.length?('（貼咗 '+arr.length+' 個名，多出嘅 '+(arr.length-S.students.length)+' 個會另外加做新學生）'):'')
  +'。確定？',ok=>{
  if(!ok)return;
  for(let i=0;i<n;i++){const x=arr[i];S.students[i].name=nmOf(x).slice(0,40);
   if(x&&x.e)S.students[i].en=String(x.e).slice(0,40)}
  const extra=arr.slice(S.students.length);
  extra.forEach(x=>{const st=NEWSTU(nmOf(x).slice(0,40));if(x&&x.e)st.en=String(x.e).slice(0,40);S.students.push(st)});
  save();closeM();sGood();render();
  toast('✅ 改咗 '+n+' 個名'+(extra.length?('，另加 '+extra.length+' 位'):''))})}
function addNames(arr){
 const have={};S.students.forEach(s=>have[s.name]=1);
 let n=0;
 arr.slice(0,200).forEach(x=>{
  const nm=String(x&&x.n!==undefined?x.n:x).slice(0,40);
  const en=String((x&&x.e)||'').slice(0,40);
  if(!nm||have[nm])return;have[nm]=1;
  const st=NEWSTU(nm);st.en=en;S.students.push(st);n++});
 save();closeM();sGood();render();
 toast(n?('✅ 加咗 '+n+' 位學生'):'冇新名可以加（重複名會自動略過）')}

/* ================= 🎲 大富翁棋盤抽人＋🧱 磚頭合成屋（mono） =================
   資料：st.bricks={1..5:n}（T1 泥／T2 木／T3 石／T4 金／T5 鑽石）、st.house（0–5，0＝未有屋）、st.hstat={ok,fail}
        S.mono={pos:棋子格,order:[學生 id 嘅棋盤次序],evLog:[機會/命運記錄],noRep:已抽唔重複,x2b:下一位雙倍磚,last:上一位被抽者}
   「已抽」同 🎯 轉盤共用 S.picked（🔁 重設已抽 兩邊一齊清）。
   答啱派分完全照轉盤：award(st,S.rewards[0].e)（有 undo），磚頭係額外掉落，唔影響分數。 */
/*MONO-CORE-START*/
const MB_N=['','泥磚','木磚','石磚','金磚','鑽石磚'],MB_BASE=[60,25,10,4,1];
const MH_RATE=[0,90,75,60,50,40],MH_N=['空地','小木屋','石屋','花園別墅','城堡','皇宮'];
const mI=(v,d)=>{const n=Math.round(Number(v));return Number.isFinite(n)?n:d};
/* 磚頭權重：tier i（1–5）＝ 基礎 × (1 + 0.035 × lv × (i−1)) */
function mbW(lv){lv=Math.max(1,mI(lv,1));return MB_BASE.map((w,i)=>w*(1+0.035*lv*i))}
function mbPct(lv){const w=mbW(lv),t=w.reduce((a,b)=>a+b,0);return w.map(x=>x/t*100)}
function mbRoll(lv,rnd){const w=mbW(lv),t=w.reduce((a,b)=>a+b,0);let r=(rnd||Math.random)()*t;
 for(let i=0;i<5;i++){r-=w[i];if(r<0)return i+1}return 5}
function mbFix(st){
 const b=(st.bricks&&typeof st.bricks==='object')?st.bricks:{};st.bricks={};
 for(let t=1;t<=5;t++)st.bricks[t]=Math.max(0,Math.min(99999,mI(b[t],0)));
 st.house=Math.max(0,Math.min(5,mI(st.house,0)));
 const h=(st.hstat&&typeof st.hstat==='object')?st.hstat:{};
 st.hstat={ok:Math.max(0,mI(h.ok,0)),fail:Math.max(0,mI(h.fail,0))};return st}
function mbTot(st){let n=0;for(let t=1;t<=5;t++)n+=(st.bricks&&st.bricks[t])||0;return n}
/* 融合：3 舊同級 → 1 舊高一級（100%） */
function mbFuse(st,t){mbFix(st);if(!(t>=1&&t<=4)||st.bricks[t]<3)return false;st.bricks[t]-=3;st.bricks[t+1]++;return true}
/* 建屋計劃：目標 L=house+1，要 4 舊 tier≥L；mode 'low'＝用最低合資格（慳磚），'high'＝用最高（加成功率） */
function mhPlan(st,mode){mbFix(st);const L=st.house+1;if(L>5)return null;
 const pool=[];for(let t=L;t<=5;t++)for(let k=0;k<st.bricks[t];k++)pool.push(t);
 if(mode==='high')pool.reverse();
 const use=pool.slice(0,4),up=use.filter(t=>t>L).length;
 return{L,use,have:pool.length,ok:use.length===4,rate:Math.min(95,MH_RATE[L]+5*up)}}
/* 失敗：用咗嘅磚爛一半（向下取整，即 4 舊爛 2 舊，爛低級嗰啲），屋唔會跌級 */
function mhTry(st,mode,rnd){const p=mhPlan(st,mode);if(!p||!p.ok)return null;
 p.use.forEach(t=>st.bricks[t]--);
 if((rnd||Math.random)()*100<p.rate){st.house=p.L;st.hstat.ok++;return{ok:true,L:p.L,rate:p.rate,use:p.use,lost:[],keep:[]}}
 const srt=p.use.slice().sort((a,b)=>a-b),nLost=Math.floor(srt.length/2),lost=srt.slice(0,nLost),keep=srt.slice(nLost);
 keep.forEach(t=>st.bricks[t]++);st.hstat.fail++;
 return{ok:false,L:p.L,rate:p.rate,use:p.use,lost,keep}}
function monoNormR(r){r=(r&&typeof r==='object')?r:{};
 return{pos:Math.max(0,mI(r.pos,0)),order:(Array.isArray(r.order)?r.order:[]).filter(x=>typeof x==='string').slice(0,300),
  evLog:(Array.isArray(r.evLog)?r.evLog:[]).filter(x=>x&&typeof x==='object').map(x=>({d:String(x.d||'').slice(0,10),t:String(x.t||'').slice(0,80)})).slice(-30),
  noRep:r.noRep!==false,x2b:!!r.x2b,last:typeof r.last==='string'?r.last:''}}
function monoNorm(st,s){s=s||{};st.bricks=s.bricks;st.house=s.house;st.hstat=s.hstat;mbFix(st)}
/* 棋盤幾何：上下每邊 a 格、左右每邊 b 格（唔計角），環厚 t；格數＝2a+2b+4 ≥ 學生數+4，唔夠就補「休息」格 */
function moGeom(W,H,N){N=Math.max(1,N|0);let best=null;const eMax=Math.max(3,Math.ceil(N/4)),tMin=46;
 for(let a=1;a<=N;a++)for(let b=1;b<=N;b++){const sl=2*a+2*b,E=sl-N;if(E<0||E>eMax)continue;
  const tw=Math.min(150,W/(0.85*a+2),(W-200)/2);if(tw<30)continue;
  let t=Math.min(tw,H/(0.72*b+2),(H-180)/2),Hc=H;
  if(t<tMin){t=Math.min(tw,tMin);Hc=Math.max(H,Math.ceil(t*(0.72*b+2)),Math.ceil(2*t+180))}

 ids.forEach(id=>{const st=qvStu(id);if(!st||q.done[id]||qvLeft(q)<=0)return;

  if(top&&top.rid===S.id&&top.list.length===1&&top.list[0].id===id)top.q={qid:q.id,sid:id,t:0};
  if(q.brick>0&&typeof mbFix==='function'){try{mbFix(st);st.bricks[q.brick]=(st.bricks[q.brick]||0)+1;bk++;if(top&&top.q)top.q.t=q.brick}catch(x){}}

 if(!got.length)return 0;
 save();render();confetti(90);
 toast('📜 「'+q.title+'」完成！'+(got.length>3?got.length+' 人各 +'+q.reward:got.join('、'))+(bk?'　🧱 '+qvBN(q.brick)+'×'+bk:''));

 (g||[]).forEach(({st,e})=>{if(!(e>0))return;
  if(kw[t]&&L.indexOf(kw[t])>=0)q.prog++;
  if(t==='sum'||t==='clean')q.prog+=e;
  if(t==='cnt')q.prog++;
  if(t==='who'&&st&&q.ids.indexOf(st.id)<0){q.ids.push(st.id);q.prog=q.ids.length}});
 if(t==='boss'&&dmg>0)q.prog+=Math.round(dmg);
 npcLive(q);
 if(!q.h&&q.prog*2>=q.target&&q.prog<q.target){q.h=1;try{toast(NPC[q.npc].ic+' '+NPC[q.npc].n+'：「'+NPC[q.npc].L[1]+'」')}catch(e){}}

  (S.students||[]).forEach(s=>{if(k==='tix')mgGive(s,1);else s.exp=Math.round(num(s.exp,0))+3;ids.push(s.id)});
  q.rw=k;setTimeout(()=>npcDone(q),DB.calm?200:900);return {k,ids}}
 return null}
